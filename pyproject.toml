[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "areal-rsi"
version = "0.1.0"
description = "File-backed RSI infrastructure built around DeepSeek Harness."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "AReaL Team" }]
dependencies = [
  "deepseek-harness-sdk==0.1.2rc1",
  "mcp>=2.1,<3",
  "areal-agent-runtime[api,dsh]==0.3.0",
  "pyyaml>=6,<7",
]

[project.scripts]
rsi = "areal_rsi.ui.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.15",
  "pytest>=8",
  "ruff>=0.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/areal_rsi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"] # 中文注释和 TUI 文本使用全角标点。

[project.optional-dependencies]
codex = ["areal-agent-runtime[codex]==0.3.0"]
claude = ["areal-agent-runtime[claude]==0.3.0"]
anthropic = ["areal-agent-runtime[anthropic]==0.3.0"]

[tool.uv.sources]
areal-agent-runtime = { path = "vendor/areal_agent_runtime-0.3.0-py3-none-any.whl" }
