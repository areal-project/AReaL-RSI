    LLMModel:
      type: object
      required: [model_name, endpoints, enabled]
      properties:
        model_name:
          type: string
          description: Client-facing model alias used in /v1 requests.
        endpoints:
          type: array
          minItems: 1
          description: Independently weighted upstream endpoints for this model alias.
          items:
            $ref: "#/components/schemas/LLMModelEndpoint"
        enabled:
          type: boolean
          default: true
          description: Enables or disables the whole model alias.
        metadata:
          type: object
          additionalProperties:
            type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        created_by:
          type: string
          readOnly: true
    LLMModelEndpoint:
      type: object
      required: [endpoint_id, upstream_model, base_url, inbound_protos, weight, enabled, upstream_extra_params]
      properties:
        endpoint_id:
          type: string
          description: Stable endpoint identifier within the model alias.
        upstream_model:
          type: string
          description: Model identifier sent to the configured upstream.
        base_url:
          type: string
          format: uri
          description: Per-endpoint upstream base URL.
        api_key:
          type: string
          description: Optional endpoint access/upstream key. It is masked in every response.
          example: "***"
        inbound_protos:
          type: array
          minItems: 1
          items:
            type: string
            enum: [chat, responses, messages]
          description: Protocols supported by this endpoint's upstream.
        weight:
          type: number
          format: double
          minimum: 0.000001
          default: 1
        enabled:
          type: boolean
          default: true
        upstream_extra_params:
          type: object
          additionalProperties: true
          description: >
            Extra JSON fields merged into the request sent to this endpoint's upstream. Nested objects merge recursively and this configuration takes precedence over client fields. model, stream, messages, and input are reserved and must not be set.

        health_check:
          $ref: "#/components/schemas/LLMEndpointHealthCheck"
        health:
          allOf:
            - $ref: "#/components/schemas/LLMEndpointHealth"
          readOnly: true
    LLMEndpointHealthCheck:
      type: object
      required: [url, expected_status, interval_seconds]
      properties:
        url:
          type: string
          format: uri
          description: HTTP(S) URL to probe with GET.
        expected_status:
          type: integer
          minimum: 100
          maximum: 599
          default: 200
          description: Exact HTTP status required for an endpoint to remain routable.
        interval_seconds:
          type: integer
          minimum: 5
          maximum: 86400
          default: 30
          description: Probe interval. A failed probe removes this endpoint from weighted selection.
    LLMEndpointHealth:
      type: object
      required: [state]
      properties:
        state:
          type: string
          enum: [checking, healthy, unhealthy, unmonitored, disabled]
          description: Runtime state as observed by the serving gateway instance.
        last_checked_at:
          type: string
          format: date-time
        last_healthy_at:
          type: string
          format: date-time
        last_error:
          type: string
    LLMModelListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/LLMModel"
    LLMGatewayRequest:
      type: object
      required: [model]
      description: >
        Protocol-native request body. Fields other than model and stream pass through to the OpenAI Chat Completions, OpenAI Responses, or Anthropic Messages adapter.

      properties:
        model:
          type: string
          description: Configured EnvArena LLM model alias.
        stream:
          type: boolean
          default: false
      additionalProperties: true
    LLMGatewayResponse:
      type: object
      description: Protocol-native non-streaming response from the selected upstream.
      additionalProperties: true
    CreateLLMModelRequest:
      type: object
      required: [model_name, endpoints]
      properties:
        model_name:
          type: string
        endpoints:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/LLMModelEndpointRequest"
        enabled:
          type: boolean
          default: true
        metadata:
          type: object
          additionalProperties:
            type: string
    UpdateLLMModelRequest:
      type: object
      properties:
        endpoints:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/LLMModelEndpointRequest"
        enabled:
          type: boolean
        metadata:
          type: object
          additionalProperties:
            type: string
    LLMModelEndpointRequest:
      type: object
      required: [upstream_model, base_url, inbound_protos]
      properties:
        endpoint_id:
          type: string
          description: Required to preserve an existing endpoint on PATCH; omitted IDs are generated as new endpoints.
        upstream_model:
          type: string
        base_url:
          type: string
          format: uri
        api_key:
          type: string
          description: Omit on PATCH to retain the existing endpoint key; pass an empty string to clear it.
        inbound_protos:
          type: array
          minItems: 1
          items:
            type: string
            enum: [chat, responses, messages]
        weight:
          type: number
          format: double
          minimum: 0.000001
          default: 1
        enabled:
          type: boolean
          default: true
        upstream_extra_params:
          type: object
          additionalProperties: true
          description: >
            Endpoint-specific JSON fields to merge into the upstream request. Omit on PATCH to preserve the existing value; pass {} to clear it.

        health_check:
          $ref: "#/components/schemas/LLMEndpointHealthCheck"
    EnvSpec:
      type: object
      required: [query, runtime, timeout_seconds]
      description: Env can be files-backed or image-backed. The agent workspace is ARENA_WORKSPACE=/envarena/workspace; OSS-backed platform mounts are namespaced under /envarena/ (query, files, out, result, oracle).
      properties:
        query:
          $ref: "#/components/schemas/ObjectRef"
        bundle:
          $ref: "#/components/schemas/ObjectRef"
          description: Required when runtime.kind=files.
        oracle:
          $ref: "#/components/schemas/ObjectRef"
        oracle_schema:
          type: string
          example: feiji.oracle.v1
        runtime:
          $ref: "#/components/schemas/EnvRuntimeSpec"
        query_path:
          type: string
          default: /workspace/Target.md
          description: Defaults to /workspace/Target.md.
        timeout_seconds:
          type: integer
          minimum: 1
          default: 600
        tags:
          type: array
          items:
            type: string
        resource_hints:
          $ref: "#/components/schemas/ResourceSpec"
        metadata:
          type: object
          additionalProperties: true
        data_source:
          description: Optional object-store materialization override.
          $ref: "#/components/schemas/DataSource"
    EnvRuntimeSpec:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [files, image]
        image:
          type: string
          description: Required when kind=image. This is the user-provided Env image.
          example: registry.example/envs/programbench-env:1.0.0
        profile:
          type: string
          description: Required when kind=image. Public runtime option key such as image_networked or image_offline.
          example: image_networked
        command:
          type: string
          description: Optional keepalive command for image runtimes. Defaults to sleep infinity.
    RuntimeImage:
