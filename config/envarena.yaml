envarena:
  # Set one of control_base_url or control_base_url_env. An explicit YAML value
  # wins; the default environment variable is ENVARENA_CONTROL_BASE_URL.
  # The value may be the service root or end in /openapi/v1.
  control_base_url: http://33.214.157.35:8080
  token_env: ENVARENA_API_TOKEN
  timeout_seconds: 30
  verify_ssl: true
  # Used by the current mocked model-instance startup path. Once EnvArena
  # supports starting models directly from model paths, this should map to the
  # server-returned instance/model name.
  model_instance_name_prefix: areal-rsi-

  # Defaults merged into every EvalRequest.job_config. Per-request values
  # override these defaults; nested mappings such as concurrency_policy merge
  # field-by-field.
  job_config:
    sample_numbers: 1
    concurrency_policy:
      max_parallel: 1
      max_retries: 0
      retry_backoff_seconds: 30
    tags: []

  # Harness and Benchmark refs intentionally do not have client-wide defaults.
  # Each evaluation must provide model, benchmark, harness, and optional skill
  # inputs via
  # EnvArenaClient.submit_eval.
