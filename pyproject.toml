[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "areal-rsi"
version = "0.2.0"
description = "Native Codex conversations with context-preserving RSI goals."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "src/areal_rsi/ui/dsh/upstream/LICENSE"]
authors = [{ name = "AReaL Team" }]
dependencies = [
  "jsonschema>=4,<5",
  "mcp>=2,<3",
  "python-dotenv>=1,<2",
]

[project.scripts]
areal-rsi = "areal_rsi.ui.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.15",
  "pytest>=8",
  "ruff>=0.11",
  "types-jsonschema>=4,<5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/areal_rsi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"] # 中文注释和 TUI 文本使用全角标点。
