        - name: all_experiments
          in: query
          required: false
          description: Aggregate every experiment instead of scoping to one.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Stream stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StreamStats"
        default:
