              schema:
                type: object
                properties:
                  job:
                    $ref: "#/components/schemas/BenchmarkJob"
                  tasks:
                    type: array
                    items:
                      $ref: "#/components/schemas/Task"
                  result:
                    $ref: "#/components/schemas/JobResult"
        default:
          $ref: "#/components/responses/Error"

  /openapi/v1/jobs/{job_id}/summary:
    get:
      tags: [jobs]
      summary: Get lightweight BenchmarkJob summary
      description: Returns job metadata, aggregate result, task counts, env count, and reward_ref without returning the full task list.
      parameters:
        - $ref: "#/components/parameters/JobID"
      responses:
        "200":
          description: Lightweight job summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobSummaryResponse"
        default:
          $ref: "#/components/responses/Error"

  /openapi/v1/jobs/{job_id}/envs:
    get:
      tags: [jobs]
      summary: List paged Env summaries for a BenchmarkJob
      parameters:
        - $ref: "#/components/parameters/JobID"
        - name: status
          in: query
          required: false
          description: Env/task status filter. FAILED includes terminal failure-like task statuses; RUNNING includes active non-terminal tasks.
          schema:
            type: string
            enum: [DONE, FAILED, RUNNING, PENDING, ALL]
            default: ALL
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 20
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Paged Env summaries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobEnvListResponse"
        default:
          $ref: "#/components/responses/Error"

  /openapi/v1/jobs/{job_id}/tasks:
    get:
      tags: [jobs]
      summary: List paged Tasks for a BenchmarkJob
      parameters:
        - $ref: "#/components/parameters/JobID"
        - name: env_key
          in: query
          required: false
          description: Env key or Env@version label to narrow the task list.
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [DONE, FAILED, RUNNING, PENDING, ALL]
            default: ALL
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Paged tasks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobTaskListResponse"
        default:
          $ref: "#/components/responses/Error"

  /openapi/v1/jobs/{job_id}/cancel:
    post:
      tags: [jobs]
      summary: Cancel a BenchmarkJob
      parameters:
        - $ref: "#/components/parameters/JobID"
      responses:
        "200":
          description: Job cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelJobResponse"
        "409":
          description: Job is already terminal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"

  /openapi/v1/jobs/{job_id}/stop:
    post:
      tags: [jobs]
      summary: Stop a BenchmarkJob (resumable pause)
      description: |
        Drains the job into the resumable STOPPED state: scheduling is
        cancelled, active sandboxes are destroyed and non-terminal tasks are
        parked as CANCELLED with their sandbox ids cleared. Unlike cancel —
        which abandons the job for good — a stopped job can be resumed via
        start; DONE tasks and their rewards are preserved. Allowed from
        PENDING/RUNNING/AGGREGATING/FAILED/TIMEOUT; re-stopping a
        STOPPING/STOPPED job is an idempotent convergence.
      parameters:
        - $ref: "#/components/parameters/JobID"
      responses:
        "200":
          description: Job stopped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StopJobResponse"
        "409":
          description: Job cannot be stopped from its current status (DONE/CANCELLED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"

  /openapi/v1/jobs/{job_id}/start:
    post:
      tags: [jobs]
      summary: Start (resume) a STOPPED or CANCELLED BenchmarkJob
      description: |
        Resumes a STOPPED or CANCELLED job. Every non-DONE task is reset to
        PENDING and re-scheduled under the job's current concurrency/retry
        policy; its stale reward is deleted, along with the aggregate job
        result. DONE tasks keep their status, rewards and trajectories. Task
        attempt counters are not reset, so historical attempt artifacts are
        never overwritten.
      parameters:
        - $ref: "#/components/parameters/JobID"
      responses:
        "200":
          description: Job resumed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartJobResponse"
        "409":
          description: Job is not STOPPED/CANCELLED, or the previous run is still draining
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"

  /openapi/v1/jobs/{job_id}/config:
    patch:
      tags: [jobs]
      summary: Update the runtime concurrency/retry config of a submitted job
      description: |
        Mutates max_parallel, max_retries and retry_backoff_seconds of a job
        under the config_revision optimistic lock. Omitted fields keep their
        current values. Changes take effect on the live run: the scheduler
        re-reads max_parallel every few seconds and the retry loop re-reads
        the retry policy before every retry decision.
      parameters:
        - $ref: "#/components/parameters/JobID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateJobConfigRequest"
      responses:
        "200":
          description: Config updated; the returned job carries the new config_revision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateJobConfigResponse"
        "400":
          description: Invalid values (max_parallel < 1, negative retries/backoff)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: config_revision does not match the job's current revision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"

  /openapi/v1/jobs/{job_id}/retry:
    post:
      tags: [jobs]
      summary: Manually retry tasks of a settled job (failed / all / selected)
      description: |
        Opens a new execution generation and re-runs the selected tasks.
        mode=failed re-runs failed tasks (FAILED/TIMEOUT/EVAL_FAILED/
        HARNESS_FAILED/SETUP_FAILED/COLLECT_FAILED/NO_OUTPUT — CANCELLED is
        excluded), mode=all re-runs every task, mode=selected re-runs the
        given task_ids. Task IDs and the global attempt counters are
        preserved; the previous generation's tasks, the rewards of the reset
        tasks and the job result are archived into the execution history
        first. Allowed only for settled jobs (DONE/FAILED/TIMEOUT/CANCELLED/
        STOPPED) whose previous run has released its lease. Supplying the
        same idempotency_key again returns the recorded outcome (reused=true)
        instead of opening another generation.
      parameters:
        - $ref: "#/components/parameters/JobID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetryJobRequest"
      responses:
        "200":
          description: Retry accepted (or idempotently replayed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetryJobResponse"
        "400":
          description: Invalid mode, missing task_ids for mode=selected, or no tasks match
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Job is not settled, a run is still draining, or a concurrent retry won
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"

  /openapi/v1/jobs/{job_id}/rescore:
    post:
      tags: [jobs]
      summary: Derive a standalone Job that re-scores completed Task products with another Reward
      description: |
        Creates a RESCORE Job from a completed Benchmark Job. The source
        Task's workspace/ and out/ prefixes are mounted read-only into the
        new Reward sandbox; no Agent or Harness sandbox is started and no OSS
        artifact is copied. The derived Task owns a separate writable result/
        prefix. The source Job stays unchanged and cannot be manually retried
        while an active derived Job is mounting its products. Only PUBLISHED,
        oracle-compatible Rewards with runtime.kind other than shared_env are
        accepted. RESCORE Jobs are independent audit records and are excluded
        from the default leaderboard.
      parameters:
        - $ref: "#/components/parameters/JobID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRescoreJobRequest"
      responses:
        "202":
          description: Derived RESCORE Job accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateRescoreJobResponse"
        "400":
          description: Invalid request, unpublished Reward, or incompatible oracle schema
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Source Job is not DONE, is already a RESCORE Job, or the target Reward needs a live shared_env sandbox
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"

  /openapi/v1/jobs/{job_id}/executions:
    get:
      tags: [jobs]
      summary: List the archived execution generations (manual retry history) of a job
      description: |
        Returns one entry per archived generation, oldest first. Each entry
        summarizes the retry (mode, requester, reset task ids, snapshot
        counts, archived job result). Pass full=true to embed the full task
        and reward snapshots.
      parameters:
        - $ref: "#/components/parameters/JobID"
        - name: full
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: Embed full task/reward snapshots in each entry.
      responses:
        "200":
          description: Execution history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobExecutionListResponse"
        default:
          $ref: "#/components/responses/Error"

  /openapi/v1/jobs/{job_id}/result:
    get:
      tags: [jobs]
      summary: Get aggregate JobResult
      parameters:
        - $ref: "#/components/parameters/JobID"
      responses:
        "200":
          description: Job result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobResult"
        default:
          $ref: "#/components/responses/Error"

  /openapi/v1/jobs/{job_id}/trajectories:
    get:
      tags: [jobs]
      summary: List trajectory references for every task in a job
      description: >
        Returns one entry per task with a reference to its trajectory
        (trajectory_uri + metadata). Pass inline=true to embed the parsed
        events of each task's latest attempt.
      parameters:
        - $ref: "#/components/parameters/JobID"
        - name: inline
          in: query
          required: false
          description: When true, embed each task's latest-attempt events inline.
          schema:
            type: boolean
      responses:
        "200":
          description: Trajectory references
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id:
                    type: string
                  tasks:
                    type: array
                    items:
                      type: object
                      properties:
                        task_id: { type: string }
                        env_key: { type: string }
                        sample_index: { type: integer }
                        status: { type: string }
                        attempts: { type: integer }
                        latest_attempt: { type: integer }
                        trajectory_uri: { type: string }
                        event_count: { type: integer }
                        events:
                          type: array
                          items: { type: object }
        default:
          $ref: "#/components/responses/Error"

  /openapi/v1/jobs/{job_id}/tasks/{task_id}/trajectory:
    get:
      tags: [jobs]
      summary: Get the complete trajectory of a single task attempt
      description: >
        Returns the full, structured stream-json trajectory for one task
        attempt. Default format=json parses each event into a JSON object array
        (no truncation, no escaping); format=raw streams the verbatim NDJSON.
        attempt defaults to the latest (task.attempts); valid range 1..attempts.
      parameters:
        - $ref: "#/components/parameters/JobID"
        - $ref: "#/components/parameters/TaskID"
        - name: attempt
          in: query
          required: false
          description: Which attempt to fetch (1..attempts). Defaults to latest.
          schema:
            type: integer
        - name: format
          in: query
          required: false
          description: json (default, parsed events) or raw (verbatim NDJSON download).
          schema:
            type: string
            enum: [json, raw]
      responses:
        "200":
          description: Task trajectory
          content:
            application/json:
              schema:
                type: object
                properties:
                  task_id: { type: string }
                  attempt: { type: integer }
                  event_count: { type: integer }
                  events:
                    type: array
                    items: { type: object }
            application/x-ndjson:
              schema:
                type: string
        default:
          $ref: "#/components/responses/Error"

  /openapi/v1/jobs/{job_id}/tasks/{task_id}/logs/{kind}:
    get:
      tags: [jobs]
      summary: Read one page of a task execution log
      description: >
        Returns a bounded, UTF-8-safe byte page of the harness, runner, or
        reward log stored for one task attempt. Page boundaries are aligned to
        UTF-8 rune starts, so the returned offset may be up to three bytes
        after the requested offset and content never splits a multi-byte
        character. kind=runner falls back to the harness log and kind=reward
        falls back to the shared-sandbox reward log when the dedicated object
        is absent; source_kind reports which object was served. Follow
        next_offset to read consecutive pages without gaps; next_offset is
        omitted on the final page.
      parameters:
        - $ref: "#/components/parameters/JobID"
        - $ref: "#/components/parameters/TaskID"
        - name: kind
          in: path
          required: true
          description: Which execution log to read.
          schema:
            type: string
            enum: [harness, runner, reward]
        - name: attempt
          in: query
          required: false
          description: Which attempt to fetch (1..attempts). Defaults to latest.
          schema:
            type: integer
        - name: offset
          in: query
          required: false
          description: Byte offset to start reading from. Defaults to 0.
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: limit
          in: query
          required: false
          description: Maximum bytes per page (1024..262144). Defaults to 65536.
          schema:
            type: integer
            format: int64
            minimum: 1024
            maximum: 262144
      responses:
        "200":
          description: One log page
          content:
            application/json:
              schema:
                type: object
                required:
                  [task_id, attempt, kind, source_kind, offset, limit, total_bytes, has_more, content]
                properties:
                  task_id: { type: string }
                  attempt: { type: integer }
                  kind:
                    type: string
                    enum: [harness, runner, reward]
                  source_kind:
                    type: string
                    description: Object that actually served the page (harness, runner, reward, reward_shared).
                  offset:
                    type: integer
                    format: int64
                    description: Byte offset of the first returned byte after UTF-8 alignment.
                  limit: { type: integer, format: int64 }
                  next_offset:
                    type: integer
                    format: int64
                    description: Offset of the next unread byte. Omitted on the final page.
                  total_bytes: { type: integer, format: int64 }
                  has_more: { type: boolean }
                  content: { type: string }
              example:
                task_id: task_9f2c
                attempt: 2
                kind: runner
                source_kind: harness
                offset: 0
                limit: 65536
                next_offset: 65534
                total_bytes: 214738
                has_more: true
                content: "[runner] booting sandbox...\n"
        "400":
          description: Invalid kind, attempt, offset, or limit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Task not found in the job, or no log object exists for the attempt and kind.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: The object store request failed; details are redacted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"

  /openapi/v1/tasks/{task_id}:
    get:
      tags: [tasks]
      summary: Get a Task
      parameters:
        - $ref: "#/components/parameters/TaskID"
      responses:
        "200":
          description: Task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        default:
          $ref: "#/components/responses/Error"

  /openapi/v1/tasks/{task_id}/result:
    get:
      tags: [tasks]
      summary: Get TaskResult
      parameters:
        - $ref: "#/components/parameters/TaskID"
      responses:
        "200":
          description: Task result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResult"
        default:
          $ref: "#/components/responses/Error"

  /openapi/v1/tasks/{task_id}/reward-review:
    get:
      tags: [tasks]
      summary: Get structured X2Env Reward review
      description: >
        Projects the current X2Env deterministic script report into one score
        card per atomic check and resolves only evidence declared by that
        report. It is available when the Task has a registered
        artifacts/x2env/reward_report.json. The script report remains the
        authoritative source of score and pass; verifier-agent information is
        diagnostic only. Hidden check descriptions and evidence require root.
      parameters:
        - $ref: "#/components/parameters/TaskID"
      responses:
        "200":
          description: Structured X2Env Reward review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RewardReview"
        "404":
          description: Task does not exist or has no readable X2Env Reward review.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Object-store request failed; details are redacted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"

  /openapi/v1/tasks/{task_id}/reward-review/evidence/{evidence_id}:
    get:
      tags: [tasks]
      summary: Stream one declared X2Env Reward evidence file
      description: >
        Streams only a file referenced by the current structured X2Env Reward
        review. evidence_id is an opaque value returned by reward-review;
        callers cannot use this route to request arbitrary sandbox paths.
      parameters:
        - $ref: "#/components/parameters/TaskID"
        - name: evidence_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Evidence bytes, normally an image for browser checks.
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          description: Evidence is not declared by the current review.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"

  /openapi/v1/tasks/{task_id}/trace:
    get:
      tags: [tasks]
      summary: Get product timeline and OTel trace pointer
      parameters:
        - $ref: "#/components/parameters/TaskID"
      responses:
        "200":
          description: Task trace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskTrace"
        default:
          $ref: "#/components/responses/Error"

  /openapi/v1/traces/{trace_id}:
    get:
      tags: [tasks]
      summary: Get Task trace by OTel trace_id
      parameters:
        - $ref: "#/components/parameters/TraceID"
      responses:
        "200":
          description: Task trace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskTrace"
        default:
          $ref: "#/components/responses/Error"

  /openapi/v1/tasks/{task_id}/artifacts:
    get:
      tags: [tasks]
      summary: List Task artifacts
      parameters:
        - $ref: "#/components/parameters/TaskID"
      responses:
        "200":
          description: Artifact list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ArtifactRef"
        default:
          $ref: "#/components/responses/Error"

  /openapi/v1/tasks/{task_id}/reeval:
    post:
      tags: [tasks]
      summary: Re-run Reward for an existing Task artifact set and refresh JobResult
      description: >
        Optional reward_ref must point to a published Reward version and pass
        the same oracle-schema compatibility checks used by Benchmark publish.
      parameters:
        - $ref: "#/components/parameters/TaskID"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reward_ref:
                  $ref: "#/components/schemas/VersionRef"
                reason:
                  type: string
      responses:
        "202":
          description: Re-evaluation accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        default:
          $ref: "#/components/responses/Error"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
    LLMEndpointAPIKey:
      type: apiKey
      in: header
      name: x-api-key
      description: Access key configured on an enabled endpoint of the requested LLM model alias.

  parameters:
    EnvKey:
      name: key
      in: path
      required: true
      schema:
        type: string
    HarnessKey:
      name: key
      in: path
      required: true
      schema:
        type: string
    SkillKey:
      name: key
      in: path
      required: true
      schema:
        type: string
    ToolKey:
      name: key
      in: path
      required: true
      schema:
        type: string
    RewardKey:
      name: reward_key
      in: path
      required: true
      schema:
        type: string
    BenchmarkKey:
      name: benchmark_key
      in: path
      required: true
      schema:
        type: string
    ModelKey:
      name: model_key
      in: path
      required: true
      schema:
        type: string
    LLMModelName:
      name: name
      in: path
      required: true
      schema:
        type: string
    ModelServiceID:
      name: service_id
      in: path
      required: true
      schema:
        type: string
    ModelServiceInstanceID:
      name: instance_id
      in: path
      required: true
      schema:
        type: string
    ModelServiceIncludeDetails:
      name: include_details
      in: query
      required: false
      schema:
        type: boolean
        default: true
    ModelServiceIncludeLogs:
      name: include_logs
      in: query
      required: false
      schema:
        type: boolean
        default: false
    ModelServiceLogOffset:
      name: log_offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    ModelServiceLogLimit:
      name: log_limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 100
    Version:
      name: version
      in: path
      required: true
      schema:
        type: string
        example: 1.0.0
    JobID:
      name: job_id
      in: path
      required: true
      schema:
        type: string
    StreamID:
      name: stream_id
      in: path
      required: true
      schema:
        type: string
    TaskID:
      name: task_id
      in: path
      required: true
      schema:
        type: string
    TraceID:
      name: trace_id
      in: path
      required: true
      schema:
        type: string
    StatusQuery:
      name: status
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/EntityStatus"
    TagQuery:
      name: tag
      in: query
      required: false
      description: Use multiple tag query parameters or a comma-separated list. All requested tags must match. Recommended built-in conventions include source:programbench and difficulty:easy|medium|hard.
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
    RegistryKeysQuery:
      name: keys
      in: query
      required: false
      description: Repeat this parameter to select exact Registry entity keys. When combined with created_by or other filters, all filters must match.
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
    RegistrySearchQuery:
      name: q
      in: query
      required: false
      description: Case-insensitive literal substring search across Registry entity key, name, description, tags, latest version, and creator.
      schema:
        type: string
        maxLength: 200
    CreatedByQuery:
      name: created_by
      in: query
      required: false
      description: Filter resources created by the supplied authenticated username.
      schema:
        type: string
    EnvDatasetTaskQuery:
      name: dataset_task
      in: query
      required: false
      description: Env-only dataset task filter. Matches task, online_task, or dataset tags/metadata values.
      schema:
        type: string
    EnvPartitionQuery:
      name: partition
      in: query
      required: false
      description: Env-only partition filter. Matches partition tags or comma-separated partition metadata.
      schema:
        type: string
    RegistryLimitQuery:
      name: limit
      in: query
      required: false
      description: Registry entity page size. The UI uses a fixed value of 20.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 20
    RegistryOffsetQuery:
      name: offset
      in: query
      required: false
      description: Registry entity page offset.
      schema:
        type: integer
        minimum: 0
        default: 0

  responses:
    Error:
      description: Error response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
        code:
          type: string
        details:
          type: object
          additionalProperties: true

    DependencyCheck:
      type: object
      required: [status, latency_ms]
      properties:
        status:
          type: string
          enum: [ok, degraded, disabled]
        latency_ms:
          type: number
          format: double
        error:
          type: string
        detail:
          type: string

    HealthReport:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        instance_id:
          type: string
        checks:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/DependencyCheck"

    SystemOverviewHeadline:
      type: object
      required: [max_task_state_age_seconds, arca_quota_in_use, arca_quota_limit, active_tasks, active_jobs]
      properties:
        http_success_ratio:
          type: number
          format: double
        platform_success_ratio:
          type: number
          format: double
        max_task_state_age_seconds:
          type: number
          format: double
        max_task_state_status:
          type: string
        arca_quota_in_use:
          type: integer
          format: int64
        arca_quota_limit:
          type: integer
        active_tasks:
          type: integer
          format: int64
        active_jobs:
          type: integer
          format: int64

    SystemOverviewStateRow:
      type: object
      required: [status, count, oldest_age_seconds]
      properties:
        status:
          type: string
        count:
          type: integer
          format: int64
        oldest_age_seconds:
          type: number
          format: double

    SystemOverviewSeriesPoint:
      type: object
      required: [at, value]
      properties:
        at:
          type: string
          format: date-time
        label:
          type: string
        value:
          type: number
          format: double

    SystemOverviewSeries:
      type: object
      required: [metric, points]
      properties:
        metric:
          type: string
        points:
          type: array
          items:
            $ref: "#/components/schemas/SystemOverviewSeriesPoint"

    SystemOverview:
      type: object
      required: [generated_at, window_seconds, bucket_seconds, health, headline, tasks_in_state, jobs_in_state, terminal_tasks_1h, trends]
      properties:
        generated_at:
          type: string
          format: date-time
        window_seconds:
          type: integer
        bucket_seconds:
          type: integer
        health:
          $ref: "#/components/schemas/HealthReport"
        headline:
          $ref: "#/components/schemas/SystemOverviewHeadline"
        tasks_in_state:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/SystemOverviewStateRow"
        jobs_in_state:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/SystemOverviewStateRow"
        terminal_tasks_1h:
          type: object
          nullable: true
          additionalProperties:
            type: integer
            format: int64
        trends:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/SystemOverviewSeries"
        warnings:
          type: array
          items:
            type: string

    StorageRef:
      type: string
      default: default
      description: Registry material storage binding. `default` is the immutable OSS_* environment configuration.

    OSSStorage:
      type: object
      required: [storage_id, name, bucket, endpoint, mount_id, secret_set, default, immutable, reference_count]
      properties:
        storage_id:
          type: string
        name:
          type: string
        bucket:
          type: string
        endpoint:
          type: string
        presign_endpoint:
          type: string
        prefix:
          type: string
        mount_id:
          type: string
        access_key_id_hint:
          type: string
        secret_set:
          type: boolean
        default:
          type: boolean
        immutable:
          type: boolean
        reference_count:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    OSSStorageRequest:
      type: object
      required: [storage_id, name, bucket, endpoint, mount_id]
      properties:
        storage_id:
          type: string
          pattern: '^[a-z][a-z0-9_-]{1,62}$'
        name:
          type: string
        bucket:
          type: string
        endpoint:
          type: string
        presign_endpoint:
          type: string
        prefix:
          type: string
        mount_id:
          type: string
        access_key_id:
          type: string
          writeOnly: true
        access_key_secret:
          type: string
          writeOnly: true

    UploadResult:
      type: object
      required: [uri]
      properties:
        uri:
          type: string
          description: Prefix-relative URI of the staged object; directory URIs end with /.
          example: uploads/260709/abc123/Target.md
        name:
          type: string
        size:
          type: integer
          format: int64
        sha256:
          type: string
        unpack:
          type: boolean
        storage_ref:
          $ref: "#/components/schemas/StorageRef"

    UploadManifest:
      type: object
      required: [kind, name, files]
      properties:
        base:
          type: string
          description: Scratch base from the presign response. Required for /uploads/complete, ignored by /uploads/presign.
          example: uploads/260716/0123456789abcdef
        kind:
          type: string
          enum: [file, dir]
        name:
          type: string
          description: File name (kind=file) or directory name (kind=dir) under the scratch base.
        storage_ref:
          $ref: "#/components/schemas/StorageRef"
        files:
          type: array
          maxItems: 5000
          items:
            type: object
            required: [path, size]
            properties:
              path:
                type: string
                description: Slash-separated path relative to the directory root; must not escape it.
              size:
                type: integer
                format: int64
                description: Exact byte size (max 256 MB per file, 1 GB total).
              md5:
                type: string
                description: Base64 16-byte MD5 digest. Required by /uploads/presign (folded into the signature).
              sha256:
                type: string
                description: Optional client-declared hex digest, echoed by /uploads/complete for kind=file.

    UploadPresignResult:
      type: object
      required: [base, uri, files]
      properties:
        base:
          type: string
          example: uploads/260716/0123456789abcdef
        uri:
          type: string
          description: Final URI to reference after completion; directory URIs end with /.
        name:
          type: string
        kind:
          type: string
          enum: [file, dir]
        storage_ref:
          $ref: "#/components/schemas/StorageRef"
        expires_at:
          type: string
          format: date-time
        files:
          type: array
          items:
            type: object
            properties:
              path:
                type: string
              key:
                type: string
              url:
                type: string
                description: Presigned PUT URL; upload bytes with exactly the accompanying headers.
              headers:
                type: object
                additionalProperties:
                  type: string

    CLIDownload:
      type: object
      required: [platform, uri]
      properties:
        platform:
          type: string
          description: GOOS-GOARCH token.
          example: darwin-arm64
        uri:
          type: string
          description: uploads/ OSS URI (from POST /uploads) or an absolute http(s) URL.
          example: uploads/260709/abc123/arena
        sha256:
          type: string
          description: Optional hex SHA-256; when set, `arena update` verifies the download.
        size:
          type: integer
          format: int64
          description: Optional byte size.
        url:
          type: string
          description: Derived at GET time — the streaming download route for this platform. Not persisted.
          example: https://htnn-gateway.alipay.com/envarena/openapi/v1/cli/download/darwin-arm64

    CLIManifest:
      type: object
      required: [version, downloads]
      properties:
        version:
          type: string
          example: 1.2.0
        notes:
          type: string
        published_at:
          type: string
          format: date-time
        published_by:
          type: string
        downloads:
          type: array
          items:
            $ref: "#/components/schemas/CLIDownload"

    CLIPublishRequest:
      type: object
      required: [version, downloads]
      properties:
        version:
          type: string
          example: 1.2.0
        notes:
          type: string
        downloads:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/CLIDownload"

    RuntimeConfig:
      type: object
      required: [host_addr, openapi_base_url]
      properties:
        host_addr:
          type: string
          description: Public EnvArena service origin, usually provided by HOST_ADDR.
          example: http://envarena.areal.svc.tydd-staging.alipay.net
        openapi_base_url:
          type: string
          description: Absolute OpenAPI v1 base URL rendered into copied Registry Skills. Points at the API port.
          example: http://envarena.areal.svc.tydd-staging.alipay.net:8080/openapi/v1
        runtime_profiles:
          type: object
          description: Public runtime profile choices. Template IDs are intentionally omitted.
          properties:
            env:
              type: array
              items:
                $ref: "#/components/schemas/RuntimeProfile"
            agent:
              type: array
              items:
                $ref: "#/components/schemas/RuntimeProfile"

    RuntimeProfile:
      type: object
      required: [key, label, kind]
      properties:
        key:
          type: string
          example: image_networked
        label:
          type: string
          example: 有网络
        kind:
          type: string
          example: image
        network:
          type: string
          enum: [enabled, disabled]

    EntityStatus:
      type: string
      enum: [DRAFT, PUBLISHED, DEPRECATED, ARCHIVED]

    JobStatus:
      type: string
      enum: [PENDING, RUNNING, AGGREGATING, STOPPING, STOPPED, DONE, FAILED, CANCELLED, TIMEOUT]

    TaskStatus:
      type: string
      enum:
        - PENDING
        - PREPARING
        - WAITING_AGENT_SBX_SLOT
        - CREATING_HARNESS_SBX
        - CREATING_AGENT_SBX
        - HARNESS_RUNNING
        - AGENT_RUNNING
        - WAITING_REWARD_SBX_SLOT
        - CREATING_REWARD_SBX
        - EVALUATING
        - RECORDING
        - DONE
        - HARNESS_FAILED
        - EVAL_FAILED
        - FAILED
        - TIMEOUT
        - CANCELLED

    ResultStatus:
      type: string
      enum: [OK, HARNESS_FAILED, EVAL_FAILED, FAILED, TIMEOUT, CANCELLED]

    RecoveryResult:
      type: object
      required: [recovered_jobs, reset_tasks]
      properties:
        recovered_jobs:
          type: array
          items:
            type: string
        reset_tasks:
          type: integer
          minimum: 0
        destroyed_sandboxes:
          type: array
          items:
            type: string
        skipped_sandboxes:
          type: object
          additionalProperties: true

    VersionRef:
      type: object
      required: [key, version]
      properties:
        key:
          type: string
        version:
          type: string
          example: 1.0.0

    StreamSelector:
      type: object
      properties:
        partitions:
          type: array
          description: Built-in Env time partitions such as 20260713 or 2026071308.
          items:
            type: string
        include_tags:
          type: array
          items:
            type: string
        exclude_tags:
          type: array
          items:
            type: string
        created_after:
          type: string
          format: date-time
        created_before:
          type: string
          format: date-time
        limit:
          type: integer
          minimum: 1

    Stream:
      type: object
      required: [stream_id, name, task, status]
      properties:
        stream_id:
          type: string
        name:
          type: string
        description:
          type: string
        task:
          type: string
        selector:
          $ref: "#/components/schemas/StreamSelector"
        default_harness_ref:
          $ref: "#/components/schemas/VersionRef"
        default_reward_ref:
          $ref: "#/components/schemas/VersionRef"
        status:
          type: string
          enum: [ACTIVE, ARCHIVED]
        metadata:
          type: object
          additionalProperties:
            type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        created_by:
          type: string

    CreateStreamRequest:
      type: object
      required: [name, task]
      properties:
        stream_id:
          type: string
        name:
          type: string
        description:
          type: string
        task:
          type: string
        selector:
          $ref: "#/components/schemas/StreamSelector"
        default_harness_ref:
          $ref: "#/components/schemas/VersionRef"
        default_reward_ref:
          $ref: "#/components/schemas/VersionRef"
        metadata:
          type: object
          additionalProperties:
            type: string

    UpdateStreamRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        task:
          type: string
        selector:
          $ref: "#/components/schemas/StreamSelector"
        default_harness_ref:
          $ref: "#/components/schemas/VersionRef"
        default_reward_ref:
          $ref: "#/components/schemas/VersionRef"
        status:
          type: string
          enum: [ACTIVE, ARCHIVED]
        metadata:
          type: object
          additionalProperties:
            type: string

    StreamDataRef:
      type: object
      required: [data_id, env_ref]
      properties:
        data_id:
          type: string
          example: env:tau3-retail-001@0.1.0
        env_ref:
          $ref: "#/components/schemas/VersionRef"
        partition:
          type: string
        tags:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time

    ArenaMatrix:
      type: object
      required: [stages]
      properties:
        version:
          type: integer
          description: Schema version; server coerces to >= 1.
        stages:
          type: array
          items:
            $ref: "#/components/schemas/ArenaMatrixStage"

    ArenaMatrixStage:
      type: object
      required: [id, name, rows]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        rows:
          type: array
          items:
            $ref: "#/components/schemas/ArenaMatrixRow"

    ArenaMatrixRow:
      type: object
      required: [id, ability, benchmark_refs]
      properties:
        id:
          type: string
        ability:
          type: string
        benchmark_refs:
          type: array
          items:
            $ref: "#/components/schemas/VersionRef"
        raw_benchmark_names:
          type: array
          items:
            type: string
        issues:
          type: array
          items:
            $ref: "#/components/schemas/ArenaMatrixIssue"

    ArenaMatrixIssue:
      type: object
      required: [id, title, job_ids, status]
      properties:
        id:
          type: string
        title:
          type: string
        job_ids:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [WIP, FIXED]

    LaunchOneTaskRequest:
      type: object
      description: Supply standard online-task fields, or a `playforge` object. A PlayForge request does not register a Harness and does not require `data_id`, `base_url`, or `api_key`.
      oneOf:
        - required: [data_id, base_url, api_key]
        - required: [playforge]
      properties:
        job_id:
          type: string
          description: Optional explicit Job ID, normally short-name-YYMMDDHHMM. Omit it under concurrent launches so the server generates a collision-free online-YYMMDDHHMM-<random> ID. Returns 409 if the given job_id is already taken.
          example: online-2606261654
        data_id:
          type: string
          example: env:tau3-retail-001@0.1.0
        base_url:
          type: string
          description: AReaL proxy base URL; injected for OpenAI and Anthropic-compatible clients.
        api_key:
          type: string
        model_name:
          type: string
        harness:
          type: string
          example: tau3-runner@0.1.0
        reward:
          type: string
          example: tau3-reward@0.1.0
        harness_ref:
          $ref: "#/components/schemas/VersionRef"
        reward_ref:
          $ref: "#/components/schemas/VersionRef"
        envs:
          type: object
          additionalProperties:
            type: string
        metadata:
          type: object
          additionalProperties:
            type: string
        experiment:
          type: string
          description: "Experiment dimension for this task. Tags the job with experiment:<name> and becomes the grouping key of the Stream task and stats endpoints. 1-64 chars matching ^[A-Za-z0-9][A-Za-z0-9._-]*$; omit it to leave the task unlabeled. Falls back to metadata.experiment when unset."
          example: exp-0803-baseline
        playforge:
          $ref: "#/components/schemas/PlayForgeLaunch"

    LaunchOneTaskResponse:
      type: object
      required: [accepted, stream_id, job_id, task_id, status]
      properties:
        accepted:
          type: boolean
        stream_id:
          type: string
        job_id:
          type: string
        task_id:
          type: string
        status:
          type: string

    LaunchBatchTaskItem:
      type: object
      required: [data_id]
      properties:
        data_id:
          type: string
          example: env:tau3-retail-001@0.1.0
        harness_ref:
          $ref: "#/components/schemas/VersionRef"
        reward_ref:
          $ref: "#/components/schemas/VersionRef"

    LaunchBatchTaskRequest:
      type: object
      required: [model_ref, tasks]
      properties:
        job_id:
          type: string
          description: Optional explicit Job ID. Omit it to generate a collision-free online Job ID.
        model_ref:
          $ref: "#/components/schemas/VersionRef"
        harness_ref:
          $ref: "#/components/schemas/VersionRef"
          description: Default Harness for Tasks without their own harness_ref; falls back to the Stream default.
        reward_ref:
          $ref: "#/components/schemas/VersionRef"
          description: Default Reward for Tasks without their own reward_ref; falls back to the Stream default.
        tasks:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            $ref: "#/components/schemas/LaunchBatchTaskItem"
        concurrency_policy:
          $ref: "#/components/schemas/ConcurrencyPolicy"
        metadata:
          type: object
          additionalProperties:
            type: string
        experiment:
          type: string
          description: Optional human grouping label; job_id is the concrete batch evaluation identity.

    LaunchBatchTaskResponse:
      type: object
      required: [accepted, stream_id, job_id, task_ids, job]
      properties:
        accepted:
          type: boolean
        stream_id:
          type: string
        job_id:
          type: string
        task_ids:
          type: array
          items:
            type: string
        job:
          $ref: "#/components/schemas/BenchmarkJob"

    PlayForgeLaunch:
      type: object
      required: [runtime_profile, output_oss_path]
      description: PlayForge inline Harness and controlled output contract. EnvArena resolves OSS storage and the ARCA template from `runtime_profile`; caller-selected network, storage, and template fields are not part of this schema. `mounts` are read-only additions inside the configured PlayForge OSS scope. EnvArena creates the fixed writable mounts `/output` and `/envarena/out`.
      properties:
        runtime_profile:
          type: string
          enum: [playforge]
          description: Must be `playforge`; EnvArena maps this profile to ARCA_PLAYFORGE_TEMPLATE_ID and ARENA_PLAYFORGE_STORAGE_REF.
        model_id:
          type: string
          description: Optional model override used only when `harness` is absent or empty and EnvArena selects its configured default harness. An explicit non-empty `harness` controls its own `model_id` and does not inherit defaults.
        sandbox_ttl_minutes:
          type: integer
          minimum: 1
          maximum: 180
          description: Optional runtime TTL. When absent, EnvArena uses ARENA_PLAYFORGE_SANDBOX_TTL_MINUTES (default 60).
        harness:
          $ref: "#/components/schemas/PlayForgeHarness"
        mounts:
          type: array
          items:
            $ref: "#/components/schemas/PlayForgeMount"
        output_oss_path:
          type: string
          description: PlayForge release OSS path mounted read-write at `/output`. It must be below ARENA_PLAYFORGE_OUTPUT_PREFIX.
        metadata:
          type: object
          additionalProperties:
            type: string

    PlayForgeHarness:
      type: object
      properties:
        model_id:
          type: string
          description: Non-secret sandbox model identifier. EnvArena maps it to ARCA envs.GAMEAGENT_MODEL and rejects a conflicting harness.envs.GAMEAGENT_MODEL value.
        system_prompt:
          type: string
          description: Complete OSS object path inside `<scope>/prompt-catalog/` or `<scope>/user_prompts/`. The object must be non-empty UTF-8, use `.md` or `.txt`, be at most 32 KiB, and not contain template-reserved prompt terms (`sandbox`, `mount`, `oss`, or `挂载`).
        skills:
          type: array
          items:
            type: string
          description: Absolute traversal-free OSS directories mounted read-only. A path whose immediate parent is `user_skills` uses the `user` GameAgent selector; every other valid path uses `catalog`. Duplicate selector targets are rejected.
        envs:
          type: object
          additionalProperties:
            type: string
          description: User runtime environment values merged into the ARCA environment. EnvArena injects task, trace, output, trajectory, and OTel path variables after rejecting reserved platform keys. PlayForge does not receive EnvArena built-in OTLP exporter configuration because its template owns telemetry. EnvArena persists only masked user-supplied values in the PlayForge Harness snapshot.

    PlayForgeMount:
      type: object
      required: [oss_path, mount_path]
      properties:
        oss_path:
          type: string
          description: PlayForge OSS path inside ARENA_PLAYFORGE_OSS_PREFIX for a read-only input mount.
        mount_path:
          type: string
          description: Absolute sandbox path; the mount is always read-only.

    SandboxMount:
      type: object
      required: [storage_ref, oss_path, mount_path, read_only]
      properties:
        storage_ref:
          type: string
          description: Effective EnvArena OSS storage reference selected by the PlayForge runtime profile.
        oss_path:
          type: string
          description: Effective normalized OSS path sent to ARCA.
        mount_path:
          type: string
          description: Effective absolute sandbox mount target.
        read_only:
          type: boolean
          description: True for system prompt, skills, and controlled input mounts; false only for the fixed `/output` release and `/envarena/out` telemetry mounts.

    PlayForgeHarnessSnapshot:
      type: object
      properties:
        model_id:
          type: string
          description: Non-secret model identifier selected for the ARCA sandbox.
        system_prompt:
          $ref: "#/components/schemas/PlayForgeMount"
        skills:
          type: array
          items:
            $ref: "#/components/schemas/PlayForgeMount"
        envs:
          type: object
          additionalProperties:
            type: string
          description: Redacted Harness environment values retained for task audit. Never use this field for secrets.
        runtime:
          $ref: "#/components/schemas/PlayForgeRuntimeSnapshot"

    PlayForgeRuntimeMount:
      type: object
      required: [storage_ref, oss_path, mount_path]
      properties:
        storage_ref:
          type: string
        oss_path:
          type: string
        mount_path:
          type: string

    PlayForgeGameAgentSkillSelector:
      type: object
      required: [source, name]
      properties:
        source:
          type: string
          enum: [catalog, user]
        name:
          type: string

    PlayForgeGameAgentSystemPromptSelector:
      type: object
      required: [source, path]
      properties:
        source:
          type: string
          enum: [catalog, user]
        path:
          type: string

    PlayForgeGameAgentSelector:
      type: object
      properties:
        model_id:
          type: string
        system_prompt:
          $ref: "#/components/schemas/PlayForgeGameAgentSystemPromptSelector"
        skills:
          type: array
          items:
            $ref: "#/components/schemas/PlayForgeGameAgentSkillSelector"

    PlayForgeRuntimeSnapshot:
      type: object
      required: [runtime_profile, template_id, ttl_minutes, release_output, telemetry_output, gameagent]
      properties:
        runtime_profile:
          type: string
        template_id:
          type: string
        ttl_minutes:
          type: integer
          minimum: 1
          maximum: 180
        release_output:
          $ref: "#/components/schemas/PlayForgeRuntimeMount"
        telemetry_output:
          $ref: "#/components/schemas/PlayForgeRuntimeMount"
        gameagent:
          $ref: "#/components/schemas/PlayForgeGameAgentSelector"

    PlayForgeLaunchResponse:
      type: object
      required: [stream_id, job_id, task_id, status, sandbox_url, ttl_minutes, runtime_profile, template_id, gameagent, harness_system_prompt_path, effective_output_oss_path, effective_output_storage_ref]
      properties:
        stream_id:
          type: string
        job_id:
          type: string
        task_id:
          type: string
        status:
          type: string
        sandbox_url:
          type: string
          format: uri
          description: Pre-signed ARCA session URL for sandbox port 8080. Treat it as a bearer capability and do not expose it in logs, traces, or UI.
        ttl_minutes:
          type: integer
          minimum: 1
          maximum: 180
        runtime_profile:
          type: string
        template_id:
          type: string
        gameagent:
          $ref: "#/components/schemas/PlayForgeGameAgentSelector"
        harness_system_prompt_path:
          type: string
          description: Effective in-sandbox system prompt file path. Empty when no Harness system prompt OSS file was supplied.
        effective_output_oss_path:
          type: string
          description: Effective storage-normalized release directory mounted at `/output`.
        effective_output_storage_ref:
          type: string
          description: Effective EnvArena OSS storage reference for effective_output_oss_path, selected by the PlayForge runtime profile.

    PlayForgeFinishResponse:
      type: object
      required: [task_id, status, finished]
      properties:
        task_id:
          type: string
        status:
          type: string
        finished:
          type: boolean
          description: False only while another EnvArena replica is destroying the PlayForge sandbox.

    StreamTaskRow:
      type: object
      required: [task]
      properties:
        task:
          $ref: "#/components/schemas/Task"
        job:
          $ref: "#/components/schemas/BenchmarkJob"
        reward:
          type: object
          nullable: true
          additionalProperties: true
        data_id:
          type: string
        partition:
          type: string
        experiment:
          type: string
          description: Experiment dimension of the task; absent for tasks launched without one.

    StreamRewardPoint:
      type: object
      required: [task_id, reward, computed_at]
      properties:
        task_id:
          type: string
        data_id:
          type: string
        reward:
          type: number
          minimum: 0
          maximum: 1
        computed_at:
          type: string
          format: date-time

    StreamStats:
      type: object
      required: [request_count, pending_count, running_count, done_count, failed_count, reward_points, experiment, all_experiments]
      properties:
        request_count:
          type: integer
        pending_count:
          type: integer
        running_count:
          type: integer
        done_count:
          type: integer
        failed_count:
          type: integer
        avg_reward:
          type: number
          nullable: true
        reward_points:
          type: array
          description: The 1,000 most recently computed successful reward points, ordered by computed_at.
          items:
            $ref: "#/components/schemas/StreamRewardPoint"
        experiment:
          type: string
          description: The experiment scope these counts belong to. Empty means the unlabeled tasks.
        all_experiments:
          type: boolean

    StreamExperiment:
      type: object
      required: [experiment, task_count]
      properties:
        experiment:
          type: string
          description: Experiment name; empty for the tasks launched without an experiment.
        task_count:
          type: integer

    StreamEvent:
      type: object
      required: [event_id, stream_id, type, created_at]
      properties:
        event_id:
          type: integer
          format: int64
        stream_id:
          type: string
        type:
          type: string
        actor:
          type: string
        message:
          type: string
        before:
          type: object
          additionalProperties: true
        after:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time

    ObjectRef:
      type: object
      required: [uri]
      properties:
        uri:
          type: string
          example: oss://bucket/env/feiji/1.0.0/bundle/
        digest:
          type: string
        media_type:
          type: string

    ResourceSpec:
      type: object
      properties:
        cpu:
          type: string
          example: "2"
        memory:
          type: string
          example: 4Gi
        disk:
          type: string
          example: 25Gi

    DataSource:
      type: object
      description: Object-store materialization override for Env bundles with non-standard layout.
      properties:
        kind:
          type: string
          example: oss
        bucket:
          type: string
        env_prefix:
          type: string
        oss_mount_id:
          type: string

    CreateEntityRequest:
      type: object
      required: [key, name]
      properties:
        key:
          type: string
        name:
          type: string
        description:
          type: string
        tags:
          type: array
          items:
            type: string
        metadata:
          type: object
          additionalProperties:
            type: string

    UpdateEntityRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        tags:
          type: array
          items:
            type: string
        metadata:
          type: object
          additionalProperties:
            type: string

    Env:
      type: object
      required: [key, name]
      properties:
        key:
          type: string
        name:
          type: string
        description:
          type: string
        tags:
          type: array
          items:
            type: string
        latest_version:
          type: string
        metadata:
          type: object
          additionalProperties:
            type: string

    Harness:
      allOf:
        - $ref: "#/components/schemas/Env"

    Skill:
      allOf:
        - $ref: "#/components/schemas/Env"

    Tool:
      allOf:
        - $ref: "#/components/schemas/Env"

    Reward:
      allOf:
        - $ref: "#/components/schemas/Env"

    Benchmark:
      allOf:
        - $ref: "#/components/schemas/Env"

    Model:
      allOf:
        - $ref: "#/components/schemas/Env"

    RegistryPageMeta:
      type: object
      required: [total, offset, limit]
      properties:
        total:
          type: integer
          minimum: 0
          description: Total matched entity count before pagination.
        offset:
          type: integer
          minimum: 0
          description: Applied page offset.
        limit:
          type: integer
          minimum: 1
          maximum: 200
          description: Applied page size. Defaults to 20.

    RegistryVersionListResponse:
      allOf:
        - $ref: "#/components/schemas/RegistryPageMeta"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              description: Version metadata only; fetch the existing key/version endpoint for the full spec.
              items:
                $ref: "#/components/schemas/VersionMeta"

    EnvListResponse:
      allOf:
        - $ref: "#/components/schemas/RegistryPageMeta"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Env"

    HarnessListResponse:
      allOf:
        - $ref: "#/components/schemas/RegistryPageMeta"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Harness"

    SkillListResponse:
      allOf:
        - $ref: "#/components/schemas/RegistryPageMeta"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Skill"

    ToolListResponse:
      allOf:
        - $ref: "#/components/schemas/RegistryPageMeta"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Tool"

    RewardListResponse:
      allOf:
        - $ref: "#/components/schemas/RegistryPageMeta"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Reward"

    BenchmarkListResponse:
      allOf:
        - $ref: "#/components/schemas/RegistryPageMeta"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Benchmark"

    ModelListResponse:
      allOf:
        - $ref: "#/components/schemas/RegistryPageMeta"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Model"

    LLMModel:
      type: object
      required: [model_name, endpoints, enabled]
      properties:
        model_name:
          type: string
          description: Client-facing model alias used in /v1 requests.
        endpoints:
          type: array
          minItems: 1
          description: Independently weighted upstream endpoints for this model alias.
          items:
            $ref: "#/components/schemas/LLMModelEndpoint"
        enabled:
          type: boolean
          default: true
          description: Enables or disables the whole model alias.
        metadata:
          type: object
          additionalProperties:
            type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        created_by:
          type: string
          readOnly: true

    LLMModelEndpoint:
      type: object
      required: [endpoint_id, upstream_model, base_url, inbound_protos, weight, enabled, upstream_extra_params]
      properties:
        endpoint_id:
          type: string
          description: Stable endpoint identifier within the model alias.
        upstream_model:
          type: string
          description: Model identifier sent to the configured upstream.
        base_url:
          type: string
          format: uri
          description: Per-endpoint upstream base URL.
        api_key:
          type: string
          description: Optional endpoint access/upstream key. It is masked in every response.
          example: "***"
        inbound_protos:
          type: array
          minItems: 1
          items:
            type: string
            enum: [chat, responses, messages]
          description: Protocols supported by this endpoint's upstream.
        weight:
          type: number
          format: double
          minimum: 0.000001
          default: 1
        enabled:
          type: boolean
          default: true
        upstream_extra_params:
          type: object
          additionalProperties: true
          description: >
            Extra JSON fields merged into the request sent to this endpoint's
            upstream. Nested objects merge recursively and this configuration
            takes precedence over client fields. model, stream, messages, and
            input are reserved and must not be set.
        health_check:
          $ref: "#/components/schemas/LLMEndpointHealthCheck"
        health:
          allOf:
            - $ref: "#/components/schemas/LLMEndpointHealth"
          readOnly: true

    LLMEndpointHealthCheck:
      type: object
      required: [url, expected_status, interval_seconds]
      properties:
        url:
          type: string
          format: uri
          description: HTTP(S) URL to probe with GET.
        expected_status:
          type: integer
          minimum: 100
          maximum: 599
          default: 200
          description: Exact HTTP status required for an endpoint to remain routable.
        interval_seconds:
          type: integer
          minimum: 5
          maximum: 86400
          default: 30
          description: Probe interval. A failed probe removes this endpoint from weighted selection.

    LLMEndpointHealth:
      type: object
      required: [state]
      properties:
        state:
          type: string
          enum: [checking, healthy, unhealthy, unmonitored, disabled]
          description: Runtime state as observed by the serving gateway instance.
        last_checked_at:
          type: string
          format: date-time
        last_healthy_at:
          type: string
          format: date-time
        last_error:
          type: string

    LLMModelListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/LLMModel"

    LLMGatewayRequest:
      type: object
      required: [model]
      description: >
        Protocol-native request body. Fields other than model and stream pass
        through to the OpenAI Chat Completions, OpenAI Responses, or Anthropic
        Messages adapter.
      properties:
        model:
          type: string
          description: Configured EnvArena LLM model alias.
        stream:
          type: boolean
          default: false
      additionalProperties: true

    LLMGatewayResponse:
      type: object
      description: Protocol-native non-streaming response from the selected upstream.
      additionalProperties: true

    CreateLLMModelRequest:
      type: object
      required: [model_name, endpoints]
      properties:
        model_name:
          type: string
        endpoints:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/LLMModelEndpointRequest"
        enabled:
          type: boolean
          default: true
        metadata:
          type: object
          additionalProperties:
            type: string

    UpdateLLMModelRequest:
      type: object
      properties:
        endpoints:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/LLMModelEndpointRequest"
        enabled:
          type: boolean
        metadata:
          type: object
          additionalProperties:
            type: string

    LLMModelEndpointRequest:
      type: object
      required: [upstream_model, base_url, inbound_protos]
      properties:
        endpoint_id:
          type: string
          description: Required to preserve an existing endpoint on PATCH; omitted IDs are generated as new endpoints.
        upstream_model:
          type: string
        base_url:
          type: string
          format: uri
        api_key:
          type: string
          description: Omit on PATCH to retain the existing endpoint key; pass an empty string to clear it.
        inbound_protos:
          type: array
          minItems: 1
          items:
            type: string
            enum: [chat, responses, messages]
        weight:
          type: number
          format: double
          minimum: 0.000001
          default: 1
        enabled:
          type: boolean
          default: true
        upstream_extra_params:
          type: object
          additionalProperties: true
          description: >
            Endpoint-specific JSON fields to merge into the upstream request.
            Omit on PATCH to preserve the existing value; pass {} to clear it.
        health_check:
          $ref: "#/components/schemas/LLMEndpointHealthCheck"

    CreateModelServiceRequest:
      type: object
      required: [served_model_name, model_path]
      additionalProperties: false
      properties:
        served_model_name:
          type: string
          description: Model alias exposed through EnvArena LLM Gateway after an instance becomes READY.
          example: qwen3-coder
        model_path:
          type: string
          description: Filesystem model path visible inside the AIS job.
          example: /storage/openpsi/models/Qwen__Qwen3-Coder
        image:
          type: string
          description: Optional AIS runtime image.
        replicas:
          type: integer
          minimum: 1
          default: 1
        resource_spec:
          $ref: "#/components/schemas/ModelServiceResourceSpec"
        sglang:
          $ref: "#/components/schemas/ModelServiceSglangSpec"
        gateway:
          allOf:
            - $ref: "#/components/schemas/ModelServiceGatewayConfig"
          description: >
            Gateway endpoint settings snapshotted for this service. When supplied,
            these values override catalog defaults and are used when READY instances register.
        metadata:
          type: object
          additionalProperties:
            type: string

    ModelServiceResourceSpec:
      type: object
      additionalProperties: false
      properties:
        gpu_num:
          type: integer
          minimum: 0
          default: 8
        gpu_type:
          type: string
          default: h200
        ais_cluster:
          type: string
          description: AIS cluster selector. This is the configured AIS app_name.
        node_num:
          type: integer
          minimum: 1
          default: 1
        cpu:
          type: integer
          minimum: 1
          default: 96
        memory:
          type: integer
          minimum: 1
          default: 500000
          description: AIS memory request value.
        disk_m:
          type: integer
          minimum: 1
          default: 1000000
        host_port:
          type: integer
          minimum: 1
          default: 1

    ModelServiceSglangSpec:
      type: object
      additionalProperties: false
      properties:
        tp:
          type: integer
          minimum: 1
        dp:
          type: integer
          minimum: 1
        pp_size:
          type: integer
          minimum: 1
        nccl_port:
          type: integer
          minimum: 1
        tokenizer_path:
          type: string
        context_length:
          type: integer
          minimum: 1
        tool_call_parser:
          type: string
        reasoning_parser:
          type: string
        trust_remote_code:
          type: boolean
        chunked_prefill_size:
          type: integer
          minimum: -1
        dtype:
          type: string
        mem_fraction_static:
          type: number
          format: double
          exclusiveMinimum: true
          minimum: 0
        max_running_requests:
          type: integer
          minimum: 1
        mamba_full_memory_ratio:
          type: number
          format: double
          exclusiveMinimum: true
          minimum: 0
        json_model_override_args:
          type: string
        model_loader_extra_config:
          type: string
        chat_template:
          type: string
        watchdog_timeout:
          type: integer
          minimum: 1
        log_level:
          type: string
        disable_chunked_prefix_cache:
          type: boolean
        disable_flashinfer_autotune:
          type: boolean
        enable_metrics:
          type: boolean
        enable_cache_report:
          type: boolean
        log_requests:
          type: boolean
        log_requests_level:
          type: integer
          minimum: 0
        runtime_prepare_command:
          type: string
        env:
          type: object
          description: Additional environment variables for SGLang. Variables managed by model-service are rejected, including MODEL_SERVICE_ID, MODEL_INSTANCE_ID, MODEL_PATH, SERVED_MODEL_NAME, CONTROL_BASE_URL, REGISTER_URL, STARTED_URL, REGISTER_TOKEN, SGLANG_PORT, SGLANG_PORT_INDEX, SGLANG_NNODES, SGLANG_NODE_RANK, SGLANG_DIST_INIT_ADDR, and SGLANG_LOG_DIR.
          additionalProperties:
            type: string
        extra_args:
          type: string

    ModelServiceCommandPreview:
      type: object
      required: [object, launcher_module, argv, command]
      properties:
        object:
          type: string
          example: sglang_command_preview
        launcher_module:
          type: string
          example: sglang serve
        argv:
          type: array
          items:
            type: string
        command:
          type: string

    ModelServiceDataStoreConfig:
      type: object
      additionalProperties: false
      required: [mount_point, store_name, sub_path]
      properties:
        mount_point:
          type: string
        store_name:
          type: string
        sub_path:
          type: string

    ModelServiceAISRuntimeConfig:
      type: object
      additionalProperties: false
      properties:
        login_name:
          type: string
          default: aistudio
        app_name:
          type: string
          default: areals3
        group_id:
          type: integer
          minimum: 0
        priority:
          type: string
          default: low
        runtime:
          type: string
          default: pytorch
        retry_max_attempt:
          type: integer
          minimum: 1
          default: 3
        job_script_path:
          type: string
        default_image:
          type: string
        pypai_target_dir:
          type: string
          description: Optional PyPAI local target directory for generated job files. Empty keeps PyPAI default.
        data_stores:
          type: array
          items:
