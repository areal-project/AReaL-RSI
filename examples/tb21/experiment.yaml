# Terminal-Bench 2.1 uses env_refs and pins tb2-reward@4.0.16.
mode: remote
backend: envarena
benchmark: tb21-terminus2-full@2.1.1
harness: terminus-2-tb21@1.0.10
model: gpt-6-astra-4ipic@1.0.0
research_harness: dsh
namespace: areal-tb21-main

# Development cases selected in the earlier GPT-5.6 campaign; remeasure with Astra.
train_cases:
  - tb2-fix-ocaml-gc
  - tb2-kv-store-grpc

# Fixed selection cases; historical GPT-5.6 outcomes are not Astra baselines.
validate_cases:
  - tb2-make-doom-for-mips
  - tb2-cancel-async-tasks

allowed_changes:
  - system_prompt
  - model_parameters
artifact_globs: []
sample_numbers: 1
max_parallel: 4
max_retries: 0
poll_seconds: 20
timeout_seconds: 18000
target_score: 1.0
