# End-to-end Experience OPD Run launched from RSI (2-node nested-Slurm).
#
# The train step submits AReaL's 2-node Experience OPD Slurm driver
# (sbatch_experience_opd_qwen3_30b_2node.sh -> swe_experience_opd_2node...yaml,
# 2x8=16 GPU). EnvArena stays mocked; the Researcher/skill steps run on the mock
# client. A fixed experience_path is provided below, so the controller uses it
# directly as the OPD experience_path (it does not override an explicitly
# configured experience_path with the Researcher's).
#
# Needs a real 2-node GPU allocation + the deployment roots/secrets in the
# environment (AWEX_ROOT/SGLANG_PYTHON_ROOT/FLASH_LINEAR_ATTENTION_ROOT/
# AENV_SYSTEM_URL/WANDB_*/PYPI_INDEX_URL); not runnable on a single node.
run:
  initial_ckpt: /storage/openpsi/models/Qwen__Qwen3-Coder-30B-A3B-Instruct
  method: opd
  max_iterations: 1
  run_root: /storage/openpsi/rsi-runs/swe-opd-2node

env:
  benchmark: swe-bench-verified@mock
  holdout_benchmark: swe-bench-verified@mock
  harness_config:
    harness: claude-code-swe-baseline@mock

services:
  areal:
    config_path: areal.opd.yaml
  envarena:
    backend: mock
    task_set_path: /storage/openpsi/users/public/data/swe_areal_pengzai_overfit.jsonl
    task_set_limit: 64
  research:
    backend: mock

train:
  config:
    # Fixed experience map (used directly as the OPD experience_path).
    experience_path: /storage/openpsi/users/wanghuaijie.whj/zeta/multitask_data/exp7_agent_qwen3_coder_user_claude.json
    train_data_path: /storage/openpsi/users/public/data/swe_areal_pengzai_overfit.jsonl
    valid_data_path: /storage/openpsi/users/public/data/swe_areal_pengzai_overfit.jsonl
    trial_name: swe-opd-2node

stop_criteria:
  target_mean_reward: 1.0
