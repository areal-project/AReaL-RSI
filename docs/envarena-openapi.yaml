  /openapi/v1/streams/{stream_id}/experiments:
    get:
      tags: [streams]
      summary: List the experiment dimensions present in a Stream
      description: Buckets the Stream's tasks by experiment, newest first. The row whose experiment is empty holds the tasks launched without one, and the first row is the dimension the task and stats endpoints default to.
      parameters:
        - $ref: "#/components/parameters/StreamID"
      responses:
