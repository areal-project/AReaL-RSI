openapi: 3.0.3
info:
  title: EnvArena Control Plane API
  version: 0.1.1
  description: >
    Draft automation-facing API for versioned Env, Harness, Tool, Skill, Reward, Benchmark, Model, BenchmarkJob, Task, and result management.

servers:
  - url: '{__DOMAIN__}'
security:
  - BearerAuth: []
tags:
  - name: system
  - name: cli
  - name: recovery
  - name: envs
  - name: harnesses
  - name: tools
  - name: skills
  - name: rewards
  - name: benchmarks
  - name: models
  - name: llm
  - name: jobs
  - name: streams
  - name: online
  - name: leaderboard
  - name: tasks
  - name: arena
paths:
  /openapi/v1/openapi.yaml:
    get:
      tags: [system]
      summary: Get this OpenAPI document
      security: []
      responses:
        "200":
          description: OpenAPI YAML document
          content:
            application/yaml:
              schema:
                type: string
  /openapi/v1/docs:
    get:
      tags: [system]
      summary: Open Swagger UI for this API
      security: []
      responses:
        "200":
          description: Swagger UI HTML document
          content:
            text/html:
              schema:
                type: string
  /openapi/v1/cli:
    get:
      tags: [cli]
      summary: Get the latest arena CLI release (version + download links)
      description: >
        Public. Returns the latest published arena CLI release with per-platform download URLs that stream back through this API (gateway-reachable), so install.sh and `arena update` work before a token is configured.

      security: []
      responses:
        "200":
          description: Latest CLI release manifest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CLIManifest"
        "404":
          description: No CLI release has been published yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags: [cli]
      summary: Publish a new arena CLI release (root only)
      description: >
        Root only. Records the latest CLI release manifest. Upload each platform binary via POST /openapi/v1/uploads first, then reference the returned uploads/ URIs (or absolute http(s) URLs) in downloads[].

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CLIPublishRequest"
      responses:
        "201":
          description: Release recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CLIManifest"
        "400":
          description: Invalid manifest (missing version or downloads, bad platform)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Root role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /openapi/v1/cli/install.sh:
    get:
      tags: [cli]
      summary: One-line install script for the arena CLI
      description: >
        Public. Returns a POSIX shell script with this API's base URL injected. Usage: `curl -fsSL <base>/openapi/v1/cli/install.sh | sh`. It detects the OS/arch, downloads the matching binary, and installs it to /usr/local/bin (falling back to ~/.local/bin).

      security: []
      responses:
        "200":
          description: POSIX install script
          content:
            text/x-shellscript:
              schema:
                type: string
  /openapi/v1/cli/download/{platform}:
    get:
      tags: [cli]
      summary: Download the arena CLI binary for a platform
      description: >
        Public. Streams the platform binary from OSS (or 302-redirects when the release references an absolute URL). platform is a GOOS-GOARCH token, e.g. darwin-arm64 or linux-amd64.

      security: []
      parameters:
        - name: platform
          in: path
          required: true
          schema:
            type: string
          example: darwin-arm64
      responses:
        "200":
          description: Binary stream
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "302":
          description: Redirect to an absolute download URL
        "404":
          description: No release, or platform not available in the release
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /openapi/v1/uploads:
    post:
      tags: [system]
      summary: Stage a file (or unpacked zip directory) and get its uploads/ URI
      description: >
        Multipart upload into the OSS scratch area. Reference the returned prefix-relative URI from any spec field; publish-time materialization copies the bytes into the immutable registry prefix. Send `unpack=zip` to unpack a zip archive into a directory URI (trailing slash).

      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: File content (max 256 MB).
                unpack:
                  type: string
                  enum: [zip]
                  description: Unpack the uploaded zip into a directory URI.
      responses:
        "201":
          description: Staged upload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResult"
        default:
          $ref: "#/components/responses/Error"
  /openapi/v1/uploads/presign:
    post:
      tags: [system]
      summary: Get presigned PUT URLs for a direct (client → OSS) upload
      description: >
        Declares an upload manifest and receives one presigned PUT URL per file under a server-generated scratch base. Clients PUT bytes straight to OSS (send exactly the returned headers; Content-MD5 is part of the signature) and then call /openapi/v1/uploads/complete. Answers 501 when direct upload is disabled (OSS_PRESIGN_ENDPOINT unset); fall back to the legacy multipart POST /openapi/v1/uploads.

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadManifest"
      responses:
        "201":
          description: Presigned upload targets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadPresignResult"
        default:
          $ref: "#/components/responses/Error"
  /openapi/v1/uploads/complete:
    post:
      tags: [system]
      summary: Verify a direct upload and get its final uploads/ URI
      description: >
        Re-declares the manifest for a presigned upload. The server lists the scratch base and requires an exact match (every manifest file present with its declared size, nothing else); mismatches answer 409.

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadManifest"
      responses:
        "201":
          description: Completed upload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResult"
        default:
          $ref: "#/components/responses/Error"
  /api/runtime-config:
    get:
      tags: [system]
      summary: Get public runtime configuration for the web UI
      description: Returns the public service origin used by the Registry Skill to render absolute OpenAPI URLs.
      security: []
      responses:
        "200":
          description: Runtime configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeConfig"
  /openapi/v1/recovery:
    post:
      tags: [recovery]
      summary: Recover interrupted Jobs after process restart
      responses:
        "202":
          description: Recovery scan accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryResult"
        default:
          $ref: "#/components/responses/Error"
  /openapi/v1/envs:
    get:
      tags: [envs]
      summary: List Env keys
      parameters:
        - $ref: "#/components/parameters/StatusQuery"
        - $ref: "#/components/parameters/TagQuery"
        - $ref: "#/components/parameters/EnvDatasetTaskQuery"
        - $ref: "#/components/parameters/EnvPartitionQuery"
        - $ref: "#/components/parameters/RegistryLimitQuery"
        - $ref: "#/components/parameters/RegistryOffsetQuery"
      responses:
        "200":
          description: Env list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvListResponse"
        default:
          $ref: "#/components/responses/Error"
    post:
      tags: [envs]
      summary: Create an Env key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEntityRequest"
      responses:
        "201":
          description: Env created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Env"
        default:
          $ref: "#/components/responses/Error"
  /openapi/v1/envs/{key}:
    get:
      tags: [envs]
      summary: Get an Env key
      parameters:
        - $ref: "#/components/parameters/EnvKey"
      responses:
        "200":
          description: Env
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Env"
        default:
          $ref: "#/components/responses/Error"
    patch:
      tags: [envs]
      summary: Update Env display metadata
      parameters:
        - $ref: "#/components/parameters/EnvKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEntityRequest"
      responses:
        "200":
          description: Env updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Env"
        default:
          $ref: "#/components/responses/Error"
    delete:
      tags: [envs]
      summary: Soft-delete an Env key
      description: Marks the Env as DELETED; normal reads hide it. Only root or the creator may delete it.
      parameters:
        - $ref: "#/components/parameters/EnvKey"
      responses:
        "204":
          description: Env deleted
        default:
          $ref: "#/components/responses/Error"
  /openapi/v1/envs/{key}/versions:
    get:
      tags: [envs]
      summary: List Env versions
      parameters:
        - $ref: "#/components/parameters/EnvKey"
        - $ref: "#/components/parameters/StatusQuery"
      responses:
        "200":
          description: Env versions
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/EnvVersion"
        default:
          $ref: "#/components/responses/Error"
    post:
      tags: [envs]
      summary: Create a draft Env version
      parameters:
        - $ref: "#/components/parameters/EnvKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
