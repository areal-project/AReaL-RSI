envarena:
  # Set one of control_base_url or control_base_url_env. An explicit YAML value
  # wins; the default environment variable is ENVARENA_CONTROL_BASE_URL.
  # The value may be the service root or end in /openapi/v1.
  control_base_url_env: ENVARENA_CONTROL_BASE_URL
  token_env: ENVARENA_API_TOKEN
  timeout_seconds: 30
  verify_ssl: true

  gateway:
    # Defaults used when registering an AReaL endpoint as an EnvArena gateway
    # route. model_ref "ckpt-001" becomes "areal-rsi-ckpt-001" by default.
    model_alias_prefix: areal-rsi-
    # Applied only when the endpoint does not provide inbound_protos itself.
    # List only protocols that the AReaL endpoint actually supports.
    inbound_protos: [chat, responses]

  # Harness and Benchmark refs intentionally do not have client-wide defaults.
  # Each evaluation must provide harness_config.harness_ref and either a
  # Benchmark "key@version" task_set or explicit refs via submit_benchmark_job.
