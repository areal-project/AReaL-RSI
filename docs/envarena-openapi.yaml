          description: Repeat the parameter or use a comma-separated value. All requested Job tags must match.
          schema:
            type: string
      responses:
        "200":
          description: Job list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/BenchmarkJob"
        default:
          $ref: "#/components/responses/Error"
    post:
      tags: [jobs]
      summary: Create and enqueue a BenchmarkJob
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateJobRequest"
      responses:
        "202":
          description: Job accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAcceptedResponse"
        default:
          $ref: "#/components/responses/Error"

  /openapi/v1/jobs/{job_id}:
    get:
      tags: [jobs]
      summary: Get a BenchmarkJob with all Tasks
      parameters:
        - $ref: "#/components/parameters/JobID"
      responses:
        "200":
          description: Job detail
