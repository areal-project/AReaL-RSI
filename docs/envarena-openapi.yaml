      responses:
        "200":
          description: Parameter metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelServiceCatalogParameters"
        default:
          $ref: "#/components/responses/Error"

  /openapi/v1/model-services/catalog/models/{model_id}/config:
    get:
      tags: [model-services]
      summary: Read config.json for a catalog model
      parameters:
        - name: model_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Model config.json detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelServiceCatalogConfig"
        default:
          $ref: "#/components/responses/Error"

  /openapi/v1/model-services/catalog/images:
    post:
      tags: [model-services]
      summary: Add an AIS image to the model service catalog
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelServiceCatalogImageRequest"
      responses:
        "201":
          description: Created catalog image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelServiceCatalogImage"
        default:
          $ref: "#/components/responses/Error"

  /openapi/v1/model-services/catalog/images/{image}:
    put:
      tags: [model-services]
      summary: Rename or update an AIS image in the model service catalog
      parameters:
        - name: image
          in: path
          required: true
          schema:
            type: string
          description: URL-encoded image string; slashes are accepted by the server route.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelServiceCatalogImageRequest"
      responses:
        "200":
          description: Updated catalog image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelServiceCatalogImage"
        default:
          $ref: "#/components/responses/Error"
    delete:
      tags: [model-services]
      summary: Delete an unused AIS image from the model service catalog
      parameters:
        - name: image
          in: path
          required: true
          schema:
            type: string
          description: URL-encoded image string; slashes are accepted by the server route.
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        default:
          $ref: "#/components/responses/Error"

  /openapi/v1/model-services:
    get:
      tags: [model-services]
      summary: List model services
      responses:
        "200":
          description: Model service list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelServiceListResponse"
        default:
          $ref: "#/components/responses/Error"
    post:
      tags: [model-services]
      summary: Create a model service and enqueue AIS SGLang instance submissions
      description: EnvArena writes service and instance rows to the existing Arena store, returns immediately with instances in SUBMITTING, and submits AIS jobs through the Python AIS bridge in the background.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateModelServiceRequest"
      responses:
        "201":
          description: Created model service
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelService"
        default:
          $ref: "#/components/responses/Error"

  /openapi/v1/model-services/cleanup-stopped:
    post:
      tags: [model-services]
      summary: Delete all stopped or failed model services (root only)
      description: Deletes only services whose instances are all STOPPED or FAILED. Per-service destructive actions remain restricted to the service creator.
      responses:
        "200":
          description: Cleanup report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelServiceCleanupStoppedReport"
        default:
          $ref: "#/components/responses/Error"

  /openapi/v1/model-services/settings:
    get:
      tags: [model-services]
      summary: Get model-service runtime settings (root only)
      description: Secret tokens are reported only as configured/hint flags; root can update them by sending new token values.
      responses:
        "200":
          description: Runtime settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelServiceSettings"
        default:
          $ref: "#/components/responses/Error"
    put:
      tags: [model-services]
      summary: Update model-service runtime settings (root only)
      description: Updates DB-backed model-service defaults, including Go-side bridge/register tokens. MODEL_AIS_BRIDGE_ADDR remains a bridge process startup setting.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateModelServiceSettingsRequest"
      responses:
        "200":
          description: Updated runtime settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelServiceSettings"
        default:
          $ref: "#/components/responses/Error"

  /openapi/v1/model-services/migrations:
    post:
      operationId: importModelServiceMigration
      summary: Import an AModelService -> Arena model-service exchange file (root only)
      tags: [model-services]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Exchange file with schema "arena.model-service.migration/v1"
      responses:
        "200":
          description: Migration report
          content:
            application/json:
              schema:
                type: object
                properties:
                  catalog_models: { type: integer }
                  catalog_images: { type: integer }
                  services_imported: { type: integer }
                  instances_imported: { type: integer }
                  ready_gateway_endpoints: { type: integer }
                  services_skipped:
                    type: array
                    items:
                      type: object
                      properties:
                        service_id: { type: string }
                        served_model_name: { type: string }
                        reason: { type: string }
        "400": { description: Invalid or unsupported exchange file }
        "403": { description: Root privileges required }

  /openapi/v1/model-services/{service_id}:
    get:
      tags: [model-services]
      summary: Get a model service
      parameters:
        - $ref: "#/components/parameters/ModelServiceID"
      responses:
        "200":
          description: Model service detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelService"
        default:
          $ref: "#/components/responses/Error"
    delete:
      tags: [model-services]
      summary: Delete a model service with no active instances
      description: Deletes the service and its remaining stopped or failed instances. Active instances must be stopped first.
      parameters:
        - $ref: "#/components/parameters/ModelServiceID"
      responses:
        "204":
          description: Model service deleted
        default:
          $ref: "#/components/responses/Error"

  /openapi/v1/model-services/{service_id}/stop:
    post:
      tags: [model-services]
      summary: Stop all instances of a model service
      parameters:
        - $ref: "#/components/parameters/ModelServiceID"
      responses:
        "200":
          description: Stopped model service
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelService"
        default:
          $ref: "#/components/responses/Error"

  /openapi/v1/model-services/{service_id}/instances/{instance_id}:
    get:
      tags: [model-services]
      summary: Get a model service instance
      parameters:
        - $ref: "#/components/parameters/ModelServiceID"
        - $ref: "#/components/parameters/ModelServiceInstanceID"
        - name: include_ais
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - $ref: "#/components/parameters/ModelServiceIncludeDetails"
        - $ref: "#/components/parameters/ModelServiceIncludeLogs"
        - $ref: "#/components/parameters/ModelServiceLogOffset"
        - $ref: "#/components/parameters/ModelServiceLogLimit"
      responses:
        "200":
          description: Model service instance detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelServiceInstanceDetail"
        default:
          $ref: "#/components/responses/Error"
    delete:
      tags: [model-services]
      summary: Delete one stopped or failed model service instance
      parameters:
        - $ref: "#/components/parameters/ModelServiceID"
        - $ref: "#/components/parameters/ModelServiceInstanceID"
      responses:
        "200":
          description: Parent model service after deleting the instance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelService"
        default:
          $ref: "#/components/responses/Error"

  /openapi/v1/model-services/{service_id}/instances/{instance_id}/check:
    get:
      tags: [model-services]
      summary: Check one model service instance
      description: Checks the control-plane record, direct SGLang endpoint, OpenAI-compatible routes, Arena LLM Gateway route, AIS job, and local SGLang logs.
      parameters:
        - $ref: "#/components/parameters/ModelServiceID"
        - $ref: "#/components/parameters/ModelServiceInstanceID"
        - name: health_timeout
          in: query
          required: false
          schema:
            type: number
            format: double
            minimum: 0
            default: 2
      responses:
        "200":
          description: Instance check result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelServiceInstanceCheck"
        default:
          $ref: "#/components/responses/Error"

  /openapi/v1/model-services/{service_id}/instances/{instance_id}/stop:
    post:
      tags: [model-services]
      summary: Stop one model service instance
      parameters:
        - $ref: "#/components/parameters/ModelServiceID"
        - $ref: "#/components/parameters/ModelServiceInstanceID"
      responses:
        "200":
          description: Parent model service after stopping the instance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelService"
        default:
          $ref: "#/components/responses/Error"

  /openapi/v1/model-services/{service_id}/instances/{instance_id}/probe:
    post:
      tags: [model-services]
      summary: Probe one READY model service instance through the control plane
      description: The API server forwards a non-streaming OpenAI Chat, OpenAI Responses, or Anthropic Messages request to the instance's registered SGLang endpoint.
      parameters:
        - $ref: "#/components/parameters/ModelServiceID"
        - $ref: "#/components/parameters/ModelServiceInstanceID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelServiceInstanceProbeRequest"
      responses:
        "200":
          description: Probe result wrapper
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelServiceInstanceProbeResponse"
        default:
          $ref: "#/components/responses/Error"

  /openapi/v1/model-services/{service_id}/instances/{instance_id}/ais:
    get:
      tags: [model-services]
      summary: Query AIS job detail for one model service instance
      parameters:
        - $ref: "#/components/parameters/ModelServiceID"
        - $ref: "#/components/parameters/ModelServiceInstanceID"
        - $ref: "#/components/parameters/ModelServiceIncludeDetails"
        - $ref: "#/components/parameters/ModelServiceIncludeLogs"
        - $ref: "#/components/parameters/ModelServiceLogOffset"
        - $ref: "#/components/parameters/ModelServiceLogLimit"
      responses:
        "200":
          description: AIS job detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelServiceAISJob"
        default:
          $ref: "#/components/responses/Error"

  /openapi/v1/model-services/{service_id}/instances/{instance_id}/logs:
    get:
      tags: [model-services]
      summary: Query local SGLang logs for one model service instance
      parameters:
        - $ref: "#/components/parameters/ModelServiceID"
        - $ref: "#/components/parameters/ModelServiceInstanceID"
        - name: file_name
          in: query
          required: false
          schema:
            type: string
        - name: tail_lines
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 200
        - name: max_bytes
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 200000
        - name: line_offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
        - name: line_limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 500
        - name: include_content
          in: query
          required: false
          schema:
            type: boolean
            default: true
      responses:
        "200":
          description: Local log files and optional content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelServiceInstanceLogs"
        default:
          $ref: "#/components/responses/Error"

  /openapi/v1/model-service/internal/started:
    post:
      tags: [model-services]
      summary: Internal callback marking an AIS instance as started
      description: Internal endpoint called by AIS jobs. Authorization bearer value must match ARENA_MODEL_SERVICE_REGISTER_TOKEN, not a user token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelServiceInstanceStartedRequest"
      responses:
        "200":
          description: Updated model service instance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelServiceInstance"
        default:
          $ref: "#/components/responses/Error"

  /openapi/v1/model-service/internal/register:
    post:
      tags: [model-services]
      summary: Internal callback registering a ready SGLang endpoint
      description: Internal endpoint called by AIS jobs after SGLang health and model probes pass. Authorization bearer value must match ARENA_MODEL_SERVICE_REGISTER_TOKEN.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelServiceRegisterInstanceRequest"
      responses:
        "200":
          description: Parent model service after registering the ready endpoint
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelService"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/chat/completions:
    post:
      tags: [llm]
      summary: OpenAI-compatible chat completions through the embedded LLM gateway
      description: >
        Sends an OpenAI Chat Completions request to the configured model alias.
        Set stream=true to receive an unbuffered Server-Sent Events response.
        Authenticate with Authorization: Bearer (an Arena token or enabled
        endpoint key), or x-api-key (an enabled endpoint key).
      security:
        - BearerAuth: []
        - LLMEndpointAPIKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LLMGatewayRequest"
      responses:
        "200":
          description: OpenAI Chat Completions response or Server-Sent Events stream
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LLMGatewayResponse"
            text/event-stream:
              schema:
                type: string
        default:
          $ref: "#/components/responses/Error"

  /api/v1/responses:
    post:
      tags: [llm]
      summary: OpenAI-compatible Responses through the embedded LLM gateway
      description: >
        Sends an OpenAI Responses request to the configured model alias.
        Set stream=true to receive an unbuffered Server-Sent Events response.
        Authenticate with Authorization: Bearer (an Arena token or enabled
        endpoint key).
      security:
        - BearerAuth: []
        - LLMEndpointAPIKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LLMGatewayRequest"
      responses:
        "200":
          description: OpenAI Responses response or Server-Sent Events stream
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LLMGatewayResponse"
            text/event-stream:
              schema:
                type: string
        default:
          $ref: "#/components/responses/Error"

  /api/v1/messages:
    post:
      tags: [llm]
      summary: Anthropic-compatible Messages through the embedded LLM gateway
      description: >
        Sends an Anthropic Messages request to the configured model alias.
        Set stream=true to receive an unbuffered Server-Sent Events response.
        Authenticate with Authorization: Bearer (an Arena token or enabled
        endpoint key), or x-api-key (an enabled endpoint key, as used by the
        Anthropic SDK).
      security:
        - BearerAuth: []
        - LLMEndpointAPIKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LLMGatewayRequest"
      responses:
        "200":
          description: Anthropic Messages response or Server-Sent Events stream
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LLMGatewayResponse"
            text/event-stream:
              schema:
                type: string
        default:
          $ref: "#/components/responses/Error"

  /openapi/v1/streams:
    get:
      tags: [streams]
      summary: List online Streams
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [ACTIVE, ARCHIVED]
      responses:
        "200":
          description: Stream list
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Stream"
        default:
          $ref: "#/components/responses/Error"
    post:
      tags: [streams]
      summary: Create an online Stream
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStreamRequest"
      responses:
        "201":
          description: Created Stream
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stream"
        default:
          $ref: "#/components/responses/Error"

  /openapi/v1/streams/{stream_id}:
    get:
      tags: [streams]
      summary: Get a Stream with current stats
      parameters:
        - $ref: "#/components/parameters/StreamID"
      responses:
        "200":
          description: Stream detail
          content:
            application/json:
              schema:
                type: object
                required: [stream]
                properties:
                  stream:
                    $ref: "#/components/schemas/Stream"
                  stats:
                    $ref: "#/components/schemas/StreamStats"
        default:
          $ref: "#/components/responses/Error"
    patch:
      tags: [streams]
      summary: Update mutable Stream configuration
      parameters:
        - $ref: "#/components/parameters/StreamID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStreamRequest"
      responses:
        "200":
          description: Updated Stream
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stream"
        default:
          $ref: "#/components/responses/Error"
    delete:
      tags: [streams]
      summary: Soft-delete a Stream
      description: Marks the Stream as DELETED; normal reads hide it. Only root or the creator may delete it.
      parameters:
        - $ref: "#/components/parameters/StreamID"
      responses:
        "204":
          description: Stream deleted
        default:
          $ref: "#/components/responses/Error"

  /openapi/v1/streams/{stream_id}/archive:
    post:
      tags: [streams]
      summary: Archive a Stream
      parameters:
        - $ref: "#/components/parameters/StreamID"
      responses:
        "200":
          description: Archived Stream
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stream"
        default:
          $ref: "#/components/responses/Error"

  /openapi/v1/streams/{stream_id}/dataset:
    post:
      tags: [streams]
      summary: Select online dataset data_ids for a Stream
      description: >
        Applies the Stream selector plus request overrides. Selector supports partition,
        include_tags, exclude_tags, and optional created_at bounds; no raw SQL is accepted.
      parameters:
        - $ref: "#/components/parameters/StreamID"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                selector:
                  $ref: "#/components/schemas/StreamSelector"
      responses:
        "200":
          description: Selected data ids
          content:
            application/json:
              schema:
                type: object
                required: [data_ids, count, total, offset, limit]
                properties:
                  data_ids:
                    type: array
                    items:
                      type: string
                  count:
                    type: integer
                    description: Number of items in this page (== len(data_ids)).
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/StreamDataRef"
                  total:
                    type: integer
                    description: Total matched data refs across all pages.
                  offset:
                    type: integer
                  limit:
                    type: integer
        default:
          $ref: "#/components/responses/Error"

  /openapi/v1/streams/{stream_id}/launch_one_task:
    post:
      tags: [online]
      summary: Launch one online task or PlayForge sandbox
      description: Standard online requests return 202 after scheduling. Requests with `playforge` synchronously create an ARCA sandbox, persist the derived Harness mount plan, and return a pre-signed port-8080 URL for the PlayForge OpenAI SSE data plane. The public wrapper does not accept caller-selected network, storage, or template fields.
      parameters:
        - $ref: "#/components/parameters/StreamID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LaunchOneTaskRequest"
      responses:
        "201":
          description: PlayForge sandbox created and pre-signed for port-8080 runtime access. The runtime client must check application health before sending OpenAI SSE.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayForgeLaunchResponse"
        "202":
          description: Online task accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LaunchOneTaskResponse"
        default:
          $ref: "#/components/responses/Error"

  /openapi/v1/streams/{stream_id}/launch_batch_task:
    post:
      tags: [online]
      summary: Launch one Stream evaluation Job containing multiple Tasks
      description: Creates one Job and fans the requested data IDs into Tasks controlled by one concurrency policy. The model is resolved from the Model Registry; per-task Harness and Reward refs override the request defaults.
      parameters:
        - $ref: "#/components/parameters/StreamID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LaunchBatchTaskRequest"
      responses:
        "202":
          description: Batch evaluation accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LaunchBatchTaskResponse"
        default:
          $ref: "#/components/responses/Error"

  /openapi/v1/streams/{stream_id}/tasks/{task_id}/finish:
    post:
      tags: [online]
      summary: Finish a PlayForge sandbox task
      description: Atomically claims and destroys the ARCA sandbox for a PlayForge task. A concurrent caller receives 202 while destruction is in progress; a stale claim is reclaimed by a later finish call or the EnvArena reaper. A completed task returns 200. TTL remains the cleanup fallback if the runtime client cannot call this endpoint.
      parameters:
        - $ref: "#/components/parameters/StreamID"
        - name: task_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: PlayForge sandbox task finished
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayForgeFinishResponse"
        "202":
          description: Another EnvArena replica is finishing the PlayForge sandbox
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayForgeFinishResponse"
        default:
          $ref: "#/components/responses/Error"

  /openapi/v1/streams/{stream_id}/tasks:
    get:
      tags: [streams]
      summary: List online tasks in a Stream
      description: Returns a database-paged task list; use limit and offset rather than loading every task in the Stream. Results are scoped to one experiment dimension unless all_experiments is set.
      parameters:
        - $ref: "#/components/parameters/StreamID"
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: experiment
          in: query
          required: false
          description: Experiment dimension scope. Omit it to land on the Stream's newest experiment; pass it empty to select the tasks launched without an experiment; ignored when all_experiments is true.
          schema:
            type: string
        - name: all_experiments
          in: query
          required: false
          description: Aggregate every experiment instead of scoping to one.
          schema:
            type: boolean
            default: false
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 100
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Stream task page
          content:
            application/json:
              schema:
                type: object
                required: [items, total, offset, limit, experiment, all_experiments]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/StreamTaskRow"
                  total:
                    type: integer
                  offset:
                    type: integer
                  limit:
                    type: integer
                  experiment:
                    type: string
                    description: The experiment scope the server resolved for this page. Empty means the unlabeled tasks.
                  all_experiments:
                    type: boolean
        default:
          $ref: "#/components/responses/Error"

  /openapi/v1/streams/{stream_id}/tasks/{task_id}:
    get:
      tags: [streams]
