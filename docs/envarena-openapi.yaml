      summary: Cancel a BenchmarkJob
      parameters:
        - $ref: "#/components/parameters/JobID"
      responses:
        "200":
          description: Job cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelJobResponse"
        "409":
          description: Job is already terminal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"
  /openapi/v1/jobs/{job_id}/stop:
    post:
      tags: [jobs]
      summary: Stop a BenchmarkJob (resumable pause)
      description: |
        Drains the job into the resumable STOPPED state: scheduling is
        cancelled, active sandboxes are destroyed and non-terminal tasks are
        parked as CANCELLED with their sandbox ids cleared. Unlike cancel —
        which abandons the job for good — a stopped job can be resumed via
        start; DONE tasks and their rewards are preserved. Allowed from
        PENDING/RUNNING/AGGREGATING/FAILED/TIMEOUT; re-stopping a
        STOPPING/STOPPED job is an idempotent convergence.
      parameters:
        - $ref: "#/components/parameters/JobID"
      responses:
        "200":
          description: Job stopped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StopJobResponse"
        "409":
          description: Job cannot be stopped from its current status (DONE/CANCELLED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"
  /openapi/v1/jobs/{job_id}/start:
    post:
      tags: [jobs]
      summary: Start (resume) a STOPPED or CANCELLED BenchmarkJob
      description: |
        Resumes a STOPPED or CANCELLED job. Every non-DONE task is reset to
        PENDING and re-scheduled under the job's current concurrency/retry
        policy; its stale reward is deleted, along with the aggregate job
        result. DONE tasks keep their status, rewards and trajectories. Task
        attempt counters are not reset, so historical attempt artifacts are
        never overwritten.
      parameters:
        - $ref: "#/components/parameters/JobID"
      responses:
        "200":
          description: Job resumed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartJobResponse"
        "409":
          description: Job is not STOPPED/CANCELLED, or the previous run is still draining
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"
  /openapi/v1/jobs/{job_id}/config:
    patch:
      tags: [jobs]
      summary: Update the runtime concurrency/retry config of a submitted job
      description: |
        Mutates max_parallel, max_retries and retry_backoff_seconds of a job
        under the config_revision optimistic lock. Omitted fields keep their
        current values. Changes take effect on the live run: the scheduler
        re-reads max_parallel every few seconds and the retry loop re-reads
        the retry policy before every retry decision.
      parameters:
        - $ref: "#/components/parameters/JobID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateJobConfigRequest"
      responses:
        "200":
          description: Config updated; the returned job carries the new config_revision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateJobConfigResponse"
        "400":
          description: Invalid values (max_parallel < 1, negative retries/backoff)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: config_revision does not match the job's current revision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"
  /openapi/v1/jobs/{job_id}/retry:
    post:
      tags: [jobs]
      summary: Manually retry tasks of a settled job (failed / all / selected)
      description: |
        Opens a new execution generation and re-runs the selected tasks.
        mode=failed re-runs failed tasks (FAILED/TIMEOUT/EVAL_FAILED/
        HARNESS_FAILED/SETUP_FAILED/COLLECT_FAILED/NO_OUTPUT — CANCELLED is
        excluded), mode=all re-runs every task, mode=selected re-runs the
        given task_ids. Task IDs and the global attempt counters are
        preserved; the previous generation's tasks, the rewards of the reset
        tasks and the job result are archived into the execution history
        first. Allowed only for settled jobs (DONE/FAILED/TIMEOUT/CANCELLED/
        STOPPED) whose previous run has released its lease. Supplying the
        same idempotency_key again returns the recorded outcome (reused=true)
        instead of opening another generation.
      parameters:
        - $ref: "#/components/parameters/JobID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetryJobRequest"
      responses:
        "200":
          description: Retry accepted (or idempotently replayed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetryJobResponse"
        "400":
          description: Invalid mode, missing task_ids for mode=selected, or no tasks match
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Job is not settled, a run is still draining, or a concurrent retry won
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"
  /openapi/v1/jobs/{job_id}/rescore:
    post:
      tags: [jobs]
      summary: Derive a standalone Job that re-scores completed Task products with another Reward
      description: |
        Creates a RESCORE Job from a completed Benchmark Job. The source
        Task's workspace/ and out/ prefixes are mounted read-only into the
        new Reward sandbox; no Agent or Harness sandbox is started and no OSS
        artifact is copied. The derived Task owns a separate writable result/
        prefix. The source Job stays unchanged and cannot be manually retried
        while an active derived Job is mounting its products. Only PUBLISHED,
        oracle-compatible Rewards with runtime.kind other than shared_env are
        accepted. RESCORE Jobs are independent audit records and are excluded
        from the default leaderboard.
      parameters:
        - $ref: "#/components/parameters/JobID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRescoreJobRequest"
      responses:
        "202":
          description: Derived RESCORE Job accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateRescoreJobResponse"
        "400":
          description: Invalid request, unpublished Reward, or incompatible oracle schema
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Source Job is not DONE, is already a RESCORE Job, or the target Reward needs a live shared_env sandbox
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"
  /openapi/v1/jobs/{job_id}/executions:
    get:
      tags: [jobs]
      summary: List the archived execution generations (manual retry history) of a job
      description: |
        Returns one entry per archived generation, oldest first. Each entry
        summarizes the retry (mode, requester, reset task ids, snapshot
        counts, archived job result). Pass full=true to embed the full task
        and reward snapshots.
      parameters:
        - $ref: "#/components/parameters/JobID"
        - name: full
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: Embed full task/reward snapshots in each entry.
      responses:
        "200":
          description: Execution history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobExecutionListResponse"
        default:
          $ref: "#/components/responses/Error"
  /openapi/v1/jobs/{job_id}/result:
    get:
      tags: [jobs]
      summary: Get aggregate JobResult
      parameters:
        - $ref: "#/components/parameters/JobID"
      responses:
        "200":
          description: Job result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobResult"
        default:
          $ref: "#/components/responses/Error"
  /openapi/v1/jobs/{job_id}/trajectories:
    get:
      tags: [jobs]
      summary: List trajectory references for every task in a job
      description: >
        Returns one entry per task with a reference to its trajectory (trajectory_uri + metadata). Pass inline=true to embed the parsed events of each task's latest attempt.

      parameters:
        - $ref: "#/components/parameters/JobID"
        - name: inline
          in: query
          required: false
          description: When true, embed each task's latest-attempt events inline.
          schema:
            type: boolean
      responses:
        "200":
          description: Trajectory references
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id:
                    type: string
                  tasks:
                    type: array
                    items:
                      type: object
                      properties:
                        task_id: {type: string}
                        env_key: {type: string}
                        sample_index: {type: integer}
                        status: {type: string}
                        attempts: {type: integer}
                        latest_attempt: {type: integer}
                        trajectory_uri: {type: string}
                        event_count: {type: integer}
                        events:
                          type: array
                          items: {type: object}
        default:
          $ref: "#/components/responses/Error"
  /openapi/v1/jobs/{job_id}/tasks/{task_id}/trajectory:
    get:
      tags: [jobs]
      summary: Get the complete trajectory of a single task attempt
      description: >
        Returns the full, structured stream-json trajectory for one task attempt. Default format=json parses each event into a JSON object array (no truncation, no escaping); format=raw streams the verbatim NDJSON. attempt defaults to the latest (task.attempts); valid range 1..attempts.

      parameters:
        - $ref: "#/components/parameters/JobID"
        - $ref: "#/components/parameters/TaskID"
        - name: attempt
          in: query
          required: false
          description: Which attempt to fetch (1..attempts). Defaults to latest.
          schema:
            type: integer
        - name: format
          in: query
          required: false
          description: json (default, parsed events) or raw (verbatim NDJSON download).
          schema:
            type: string
            enum: [json, raw]
      responses:
        "200":
          description: Task trajectory
          content:
            application/json:
              schema:
                type: object
                properties:
                  task_id: {type: string}
                  attempt: {type: integer}
                  event_count: {type: integer}
                  events:
                    type: array
                    items: {type: object}
            application/x-ndjson:
              schema:
                type: string
        default:
          $ref: "#/components/responses/Error"
  /openapi/v1/jobs/{job_id}/tasks/{task_id}/logs/{kind}:
    get:
      tags: [jobs]
      summary: Read one page of a task execution log
      description: >
        Returns a bounded, UTF-8-safe byte page of the harness, runner, or reward log stored for one task attempt. Page boundaries are aligned to UTF-8 rune starts, so the returned offset may be up to three bytes after the requested offset and content never splits a multi-byte character. kind=runner falls back to the harness log and kind=reward falls back to the shared-sandbox reward log when the dedicated object is absent; source_kind reports which object was served. Follow next_offset to read consecutive pages without gaps; next_offset is omitted on the final page.

      parameters:
        - $ref: "#/components/parameters/JobID"
        - $ref: "#/components/parameters/TaskID"
        - name: kind
          in: path
          required: true
          description: Which execution log to read.
          schema:
            type: string
            enum: [harness, runner, reward]
        - name: attempt
          in: query
          required: false
          description: Which attempt to fetch (1..attempts). Defaults to latest.
          schema:
            type: integer
        - name: offset
          in: query
          required: false
          description: Byte offset to start reading from. Defaults to 0.
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: limit
          in: query
          required: false
          description: Maximum bytes per page (1024..262144). Defaults to 65536.
          schema:
            type: integer
            format: int64
            minimum: 1024
            maximum: 262144
      responses:
        "200":
          description: One log page
          content:
            application/json:
              schema:
                type: object
                required: [task_id, attempt, kind, source_kind, offset, limit, total_bytes, has_more, content]
                properties:
                  task_id: {type: string}
                  attempt: {type: integer}
                  kind:
                    type: string
                    enum: [harness, runner, reward]
                  source_kind:
                    type: string
                    description: Object that actually served the page (harness, runner, reward, reward_shared).
                  offset:
                    type: integer
                    format: int64
                    description: Byte offset of the first returned byte after UTF-8 alignment.
                  limit: {type: integer, format: int64}
                  next_offset:
                    type: integer
                    format: int64
                    description: Offset of the next unread byte. Omitted on the final page.
                  total_bytes: {type: integer, format: int64}
                  has_more: {type: boolean}
                  content: {type: string}
              example:
                task_id: task_9f2c
                attempt: 2
                kind: runner
                source_kind: harness
                offset: 0
                limit: 65536
                next_offset: 65534
                total_bytes: 214738
                has_more: true
                content: "[runner] booting sandbox...\n"
        "400":
          description: Invalid kind, attempt, offset, or limit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Task not found in the job, or no log object exists for the attempt and kind.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: The object store request failed; details are redacted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"
  /openapi/v1/tasks/{task_id}:
    get:
      tags: [tasks]
      summary: Get a Task
      parameters:
        - $ref: "#/components/parameters/TaskID"
      responses:
        "200":
          description: Task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        default:
          $ref: "#/components/responses/Error"
  /openapi/v1/tasks/{task_id}/result:
    get:
      tags: [tasks]
      summary: Get TaskResult
      parameters:
        - $ref: "#/components/parameters/TaskID"
      responses:
        "200":
          description: Task result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResult"
        default:
          $ref: "#/components/responses/Error"
  /openapi/v1/tasks/{task_id}/reward-review:
    get:
      tags: [tasks]
      summary: Get structured X2Env Reward review
      description: >
        Projects the current X2Env deterministic script report into one score card per atomic check and resolves only evidence declared by that report. It is available when the Task has a registered artifacts/x2env/reward_report.json. The script report remains the authoritative source of score and pass; verifier-agent information is diagnostic only. Hidden check descriptions and evidence require root.

      parameters:
        - $ref: "#/components/parameters/TaskID"
      responses:
        "200":
          description: Structured X2Env Reward review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RewardReview"
        "404":
          description: Task does not exist or has no readable X2Env Reward review.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Object-store request failed; details are redacted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"
  /openapi/v1/tasks/{task_id}/reward-review/evidence/{evidence_id}:
    get:
      tags: [tasks]
      summary: Stream one declared X2Env Reward evidence file
      description: >
        Streams only a file referenced by the current structured X2Env Reward review. evidence_id is an opaque value returned by reward-review; callers cannot use this route to request arbitrary sandbox paths.

      parameters:
        - $ref: "#/components/parameters/TaskID"
        - name: evidence_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Evidence bytes, normally an image for browser checks.
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          description: Evidence is not declared by the current review.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"
  /openapi/v1/tasks/{task_id}/trace:
    get:
      tags: [tasks]
      summary: Get product timeline and OTel trace pointer
      parameters:
        - $ref: "#/components/parameters/TaskID"
      responses:
        "200":
          description: Task trace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskTrace"
        default:
          $ref: "#/components/responses/Error"
  /openapi/v1/traces/{trace_id}:
    get:
      tags: [tasks]
      summary: Get Task trace by OTel trace_id
      parameters:
        - $ref: "#/components/parameters/TraceID"
      responses:
        "200":
          description: Task trace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskTrace"
        default:
          $ref: "#/components/responses/Error"
  /openapi/v1/tasks/{task_id}/artifacts:
    get:
      tags: [tasks]
      summary: List Task artifacts
      parameters:
        - $ref: "#/components/parameters/TaskID"
      responses:
        "200":
          description: Artifact list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ArtifactRef"
        default:
          $ref: "#/components/responses/Error"
  /openapi/v1/tasks/{task_id}/reeval:
    post:
      tags: [tasks]
      summary: Re-run Reward for an existing Task artifact set and refresh JobResult
      description: >
        Optional reward_ref must point to a published Reward version and pass the same oracle-schema compatibility checks used by Benchmark publish.

      parameters:
        - $ref: "#/components/parameters/TaskID"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reward_ref:
                  $ref: "#/components/schemas/VersionRef"
                reason:
                  type: string
      responses:
        "202":
          description: Re-evaluation accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        default:
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
    LLMEndpointAPIKey:
      type: apiKey
      in: header
      name: x-api-key
      description: Access key configured on an enabled endpoint of the requested LLM model alias.
  parameters:
    EnvKey:
      name: key
      in: path
      required: true
      schema:
        type: string
    HarnessKey:
      name: key
      in: path
      required: true
      schema:
        type: string
    SkillKey:
      name: key
      in: path
      required: true
      schema:
        type: string
    ToolKey:
      name: key
      in: path
      required: true
      schema:
        type: string
    RewardKey:
      name: reward_key
      in: path
      required: true
      schema:
        type: string
    BenchmarkKey:
      name: benchmark_key
      in: path
      required: true
      schema:
        type: string
    ModelKey:
      name: model_key
      in: path
      required: true
      schema:
        type: string
    LLMModelName:
      name: name
      in: path
      required: true
      schema:
        type: string
    Version:
      name: version
      in: path
      required: true
      schema:
        type: string
        example: 1.0.0
    JobID:
      name: job_id
      in: path
      required: true
      schema:
        type: string
    StreamID:
      name: stream_id
      in: path
      required: true
      schema:
        type: string
    TaskID:
      name: task_id
      in: path
      required: true
      schema:
        type: string
    TraceID:
      name: trace_id
      in: path
      required: true
      schema:
        type: string
    StatusQuery:
      name: status
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/EntityStatus"
    TagQuery:
      name: tag
      in: query
      required: false
      description: Use multiple tag query parameters or a comma-separated list. All requested tags must match. Recommended built-in conventions include source:programbench and difficulty:easy|medium|hard.
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
    EnvDatasetTaskQuery:
      name: dataset_task
      in: query
      required: false
      description: Env-only dataset task filter. Matches task, online_task, or dataset tags/metadata values.
      schema:
        type: string
    EnvPartitionQuery:
      name: partition
      in: query
      required: false
      description: Env-only partition filter. Matches partition tags or comma-separated partition metadata.
      schema:
        type: string
    RegistryLimitQuery:
      name: limit
      in: query
      required: false
      description: Registry entity page size. The UI uses a fixed value of 20.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 20
    RegistryOffsetQuery:
      name: offset
      in: query
      required: false
      description: Registry entity page offset.
      schema:
        type: integer
        minimum: 0
        default: 0
  responses:
    Error:
      description: Error response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
        code:
          type: string
        details:
          type: object
          additionalProperties: true
    UploadResult:
      type: object
      required: [uri]
      properties:
        uri:
          type: string
          description: Prefix-relative URI of the staged object; directory URIs end with /.
          example: uploads/260709/abc123/Target.md
        name:
          type: string
        size:
          type: integer
          format: int64
        sha256:
          type: string
        unpack:
          type: boolean
    UploadManifest:
      type: object
      required: [kind, name, files]
      properties:
        base:
          type: string
          description: Scratch base from the presign response. Required for /uploads/complete, ignored by /uploads/presign.
          example: uploads/260716/0123456789abcdef
        kind:
          type: string
          enum: [file, dir]
        name:
          type: string
          description: File name (kind=file) or directory name (kind=dir) under the scratch base.
        files:
          type: array
          maxItems: 5000
          items:
            type: object
            required: [path, size]
            properties:
              path:
                type: string
                description: Slash-separated path relative to the directory root; must not escape it.
              size:
                type: integer
                format: int64
                description: Exact byte size (max 256 MB per file, 1 GB total).
              md5:
                type: string
                description: Base64 16-byte MD5 digest. Required by /uploads/presign (folded into the signature).
              sha256:
                type: string
                description: Optional client-declared hex digest, echoed by /uploads/complete for kind=file.
    UploadPresignResult:
      type: object
      required: [base, uri, files]
      properties:
        base:
          type: string
          example: uploads/260716/0123456789abcdef
        uri:
          type: string
          description: Final URI to reference after completion; directory URIs end with /.
        name:
          type: string
        kind:
          type: string
          enum: [file, dir]
        expires_at:
          type: string
          format: date-time
        files:
          type: array
          items:
            type: object
            properties:
              path:
                type: string
              key:
                type: string
              url:
                type: string
                description: Presigned PUT URL; upload bytes with exactly the accompanying headers.
              headers:
                type: object
                additionalProperties:
                  type: string
    CLIDownload:
      type: object
      required: [platform, uri]
      properties:
        platform:
          type: string
          description: GOOS-GOARCH token.
          example: darwin-arm64
        uri:
          type: string
          description: uploads/ OSS URI (from POST /uploads) or an absolute http(s) URL.
          example: uploads/260709/abc123/arena
        sha256:
          type: string
          description: Optional hex SHA-256; when set, `arena update` verifies the download.
        size:
          type: integer
          format: int64
          description: Optional byte size.
        url:
          type: string
          description: Derived at GET time — the streaming download route for this platform. Not persisted.
          example: https://htnn-gateway.alipay.com/envarena/openapi/v1/cli/download/darwin-arm64
    CLIManifest:
      type: object
      required: [version, downloads]
      properties:
        version:
          type: string
          example: 1.2.0
        notes:
          type: string
        published_at:
          type: string
          format: date-time
        published_by:
          type: string
        downloads:
          type: array
          items:
            $ref: "#/components/schemas/CLIDownload"
    CLIPublishRequest:
      type: object
      required: [version, downloads]
      properties:
        version:
          type: string
          example: 1.2.0
        notes:
          type: string
        downloads:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/CLIDownload"
    RuntimeConfig:
      type: object
      required: [host_addr, openapi_base_url]
      properties:
        host_addr:
          type: string
          description: Public EnvArena service origin, usually provided by HOST_ADDR.
          example: http://envarena.areal.svc.tydd-staging.alipay.net
        openapi_base_url:
          type: string
          description: Absolute OpenAPI v1 base URL rendered into copied Registry Skills. Points at the API port.
          example: http://envarena.areal.svc.tydd-staging.alipay.net:8080/openapi/v1
        runtime_profiles:
          type: object
          description: Public runtime profile choices. Template IDs are intentionally omitted.
          properties:
            env:
              type: array
              items:
                $ref: "#/components/schemas/RuntimeProfile"
            agent:
              type: array
              items:
                $ref: "#/components/schemas/RuntimeProfile"
    RuntimeProfile:
      type: object
      required: [key, label, kind]
      properties:
        key:
          type: string
          example: image_networked
        label:
          type: string
          example: 有网络
        kind:
          type: string
          example: image
        network:
          type: string
          enum: [enabled, disabled]
    EntityStatus:
      type: string
      enum: [DRAFT, PUBLISHED, DEPRECATED, ARCHIVED]
    JobStatus:
      type: string
      enum: [PENDING, RUNNING, AGGREGATING, STOPPING, STOPPED, DONE, FAILED, CANCELLED, TIMEOUT]
    TaskStatus:
      type: string
      enum:
        - PENDING
        - PREPARING
        - WAITING_AGENT_SBX_SLOT
        - CREATING_HARNESS_SBX
        - CREATING_AGENT_SBX
        - HARNESS_RUNNING
        - AGENT_RUNNING
        - WAITING_REWARD_SBX_SLOT
        - CREATING_REWARD_SBX
        - EVALUATING
        - RECORDING
        - DONE
        - HARNESS_FAILED
        - EVAL_FAILED
        - FAILED
        - TIMEOUT
        - CANCELLED
    ResultStatus:
