<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bookmark shelf</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f8fafc;color:#18212f;font:16px system-ui,-apple-system,sans-serif}.app{width:min(100% - 32px,1000px);margin:0 auto;padding:32px 0}.subtitle{color:#64748b;margin-top:0}.form{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.field{flex:1 1 220px;min-width:0}label{display:block;font-size:.82rem;font-weight:700;margin:0 0 5px}input{width:100%;min-height:44px;padding:9px 11px;border:1px solid #cbd5e1;border-radius:8px;font:inherit;background:#fff}button{min-height:44px;padding:8px 14px;border:1px solid #cbd5e1;border-radius:8px;background:white;color:inherit;font:inherit;cursor:pointer}button:hover{background:#eef2ff}.add{background:#2563eb;color:#fff;border-color:#2563eb}.message{min-height:24px;margin:8px 0;color:#b42318}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.filters .active{background:#1d4ed8;color:white;border-color:#1d4ed8}.items{display:grid;gap:10px}.item{display:flex;align-items:center;gap:10px;padding:14px;background:#fff;border:1px solid #e2e8f0;border-radius:12px;min-width:0}.item.done{background:#f0fdf4}.toggle{width:24px;height:24px;min-width:24px;margin:0}.body{flex:1;min-width:0}.name{font-weight:700;overflow-wrap:anywhere}.url{display:block;color:#2563eb;text-decoration:none;overflow-wrap:anywhere;margin-top:3px}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.edit-input{min-width:0;flex:1}.empty{text-align:center;color:#64748b;padding:32px 16px}@media(max-width:500px){.app{width:100%;padding:20px 12px}.form{display:grid;grid-template-columns:1fr}.field{width:100%}.form .add{width:100%}.item{align-items:flex-start;flex-wrap:wrap}.body{flex-basis:calc(100% - 40px)}.actions{width:100%;padding-left:34px}.actions button{flex:1}}
</style>
</head>
<body><main class="app"><h1>Bookmark shelf</h1><p class="subtitle">Collect the links you want to find again.</p>
<form id="add-form" class="form" novalidate><div class="field"><label for="title">Title</label><input id="title" data-testid="title-input" autocomplete="off"></div><div class="field"><label for="url">URL</label><input id="url" data-testid="url-input" autocomplete="off" placeholder="https://example.com"></div><button class="add" type="submit" data-testid="add">Add bookmark</button></form>
<div id="message" class="message" aria-live="polite"></div>
<section class="filters" aria-label="Filter bookmarks"><button type="button" data-testid="filter-all" data-filter="all" class="active">All</button><button type="button" data-testid="filter-active" data-filter="active">Active</button><button type="button" data-testid="filter-completed" data-filter="completed">Completed</button></section>
<div id="items" class="items"></div></main>
<script>
(function(){
 const KEY="bookmark-shelf-v1", form=document.getElementById("add-form"), title=document.getElementById("title"), url=document.getElementById("url"), list=document.getElementById("items"), message=document.getElementById("message");
 let data=load(), filter="all";
 function load(){try{const x=JSON.parse(localStorage.getItem(KEY));return Array.isArray(x)?x.filter(b=>b&&typeof b.title==="string"&&typeof b.url==="string"):[]}catch(e){return []}}
 function persist(){localStorage.setItem(KEY,JSON.stringify(data))}
 function validUrl(value){try{const u=new URL(value);return (u.protocol==="http:"||u.protocol==="https:")&&!!u.hostname}catch(e){return false}}
 function say(text){message.textContent=text}
 function make(tag,attrs,text){const el=document.createElement(tag);Object.keys(attrs||{}).forEach(k=>el.setAttribute(k,attrs[k]));if(text!==undefined)el.textContent=text;return el}
 function render(){list.textContent="";document.querySelectorAll("[data-filter]").forEach(b=>b.classList.toggle("active",b.dataset.filter===filter));const shown=data.filter(b=>filter==="all"||(filter==="completed"?b.done:!b.done));if(!shown.length){list.append(make("div",{class:"empty"},"No bookmarks here yet."));return}shown.forEach(book=>{const row=make("article",{class:"item"+(book.done?" done":""),"data-testid":"item"});const check=make("input",{type:"checkbox","data-testid":"toggle",class:"toggle",title:"Mark completed"});check.checked=!!book.done;check.addEventListener("change",()=>{book.done=check.checked;persist();render()});row.append(check);const body=make("div",{class:"body"});const name=make("div",{class:"name"},book.title);body.append(name);body.append(make("a",{class:"url",href:book.url,target:"_blank",rel:"noopener"},book.url));row.append(body);const actions=make("div",{class:"actions"});const edit=make("button",{type:"button","data-testid":"edit"},"Edit");edit.addEventListener("click",()=>editRow(row,book));const del=make("button",{type:"button","data-testid":"delete"},"Delete");del.addEventListener("click",()=>{data=data.filter(x=>x!==book);persist();render()});actions.append(edit,del);row.append(actions);list.append(row)})}
 function editRow(row,book){row.querySelector(".body").textContent="";const input=make("input",{class:"edit-input","data-testid":"edit-input",value:book.title});input.value=book.title;row.querySelector(".body").append(input);const actions=row.querySelector(".actions");actions.textContent="";const save=make("button",{type:"button","data-testid":"save"},"Save");save.addEventListener("click",()=>{const value=input.value.trim();if(!value){say("Title cannot be empty.");input.focus();return}book.title=value;persist();say("");render()});actions.append(save);input.focus()}
 form.addEventListener("submit",e=>{e.preventDefault();const t=title.value.trim(),u=url.value.trim();if(!t){say("Title cannot be empty.");title.focus();return}if(!validUrl(u)){say("Enter a valid absolute http or https URL.");url.focus();return}data.push({title:t,url:u,done:false});persist();title.value="";url.value="";say("");render();title.focus()});
 document.querySelectorAll("[data-filter]").forEach(b=>b.addEventListener("click",()=>{filter=b.dataset.filter;render()}));render();
})();
</script></body></html>
