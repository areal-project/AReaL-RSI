<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bookmark shelf · starter</title><style>body{font:16px system-ui;max-width:720px;margin:40px auto;padding:16px}input,button{font:inherit;padding:10px}article{padding:14px;border:1px solid #ddd;margin-top:10px}</style><h1>Bookmark shelf</h1><p>Starter: adding bookmarks works. Editing, stars, filters and persistence remain to be implemented.</p><form id="form"><input data-testid="title-input" aria-label="Bookmark title"><input data-testid="url-input" type="url" aria-label="URL"><button data-testid="add">Add bookmark</button></form><main id="items"></main><script>form.onsubmit=e=>{e.preventDefault();const input=document.querySelector('input');if(!input.value.trim())return;const row=document.createElement('article');row.dataset.testid='item';row.textContent=input.value.trim();items.append(row);input.value=''}</script></html>
