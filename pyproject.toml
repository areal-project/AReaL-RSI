[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "areal-rsi"
version = "0.1.0"
description = "Auditable Harness and model improvement loop on AReaL"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = []

[project.scripts]
areal-rsi-tir = "areal_rsi_tir.cycle:main"

[project.optional-dependencies]
train = ["datasets>=3,<5", "math-verify>=0.8,<1", "pyarrow>=17,<24"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "mypy>=1.15,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/areal_rsi", "examples/areal_rsi_tir"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src", "examples"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "examples/areal_rsi_tir"]
mypy_path = ["src", "examples"]
