openapi: 3.0.3
info:
  title: EnvArena Control Plane API
  version: 0.1.1
  description: >
    Draft automation-facing API for versioned Env, Harness, Tool, Skill, Reward, Benchmark, Model,
    BenchmarkJob, Task, and result management.
servers:
  - url: http://localhost:8080
security:
  - BearerAuth: []
tags:
  - name: system
  - name: cli
  - name: recovery
  - name: envs
  - name: harnesses
  - name: tools
  - name: skills
  - name: rewards
  - name: benchmarks
  - name: models
  - name: llm
  - name: model-services
  - name: jobs
  - name: streams
  - name: online
  - name: leaderboard
  - name: tasks
  - name: arena

paths:
  /openapi/v1/openapi.yaml:
    get:
      tags: [system]
      summary: Get this OpenAPI document
      security: []
      responses:
        "200":
          description: OpenAPI YAML document
          content:
            application/yaml:
              schema:
                type: string

  /openapi/v1/docs:
    get:
      tags: [system]
      summary: Open Swagger UI for this API
      security: []
      responses:
        "200":
          description: Swagger UI HTML document
          content:
            text/html:
              schema:
                type: string

  /openapi/v1/system/overview:
    get:
      tags: [system]
      summary: Get system health and trend overview
      parameters:
        - name: window
          in: query
          required: false
          description: Trend lookback window in seconds. Values above 7 days are clamped.
          schema:
            type: integer
            minimum: 1
            default: 3600
        - name: bucket
          in: query
          required: false
          description: Trend bucket size in seconds.
          schema:
            type: integer
            minimum: 1
            default: 60
      responses:
        "200":
          description: System overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemOverview"
        default:
          $ref: "#/components/responses/Error"

  /openapi/v1/cli:
    get:
      tags: [cli]
      summary: Get the latest arena CLI release (version + download links)
      description: >
        Public. Returns the latest published arena CLI release with per-platform
        download URLs that stream back through this API (gateway-reachable), so
        install.sh and `arena update` work before a token is configured.
      security: []
      responses:
        "200":
          description: Latest CLI release manifest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CLIManifest"
        "404":
          description: No CLI release has been published yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags: [cli]
      summary: Publish a new arena CLI release (root only)
      description: >
        Root only. Records the latest CLI release manifest. Upload each
        platform binary via POST /openapi/v1/uploads first, then reference the
        returned uploads/ URIs (or absolute http(s) URLs) in downloads[].
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CLIPublishRequest"
      responses:
        "201":
          description: Release recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CLIManifest"
        "400":
          description: Invalid manifest (missing version or downloads, bad platform)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Root role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /openapi/v1/cli/install.sh:
    get:
      tags: [cli]
      summary: One-line install script for the arena CLI
      description: >
        Public. Returns a POSIX shell script with this API's base URL injected.
        Usage: `curl -fsSL <base>/openapi/v1/cli/install.sh | sh`. It detects the
        OS/arch, downloads the matching binary, and installs it to
        /usr/local/bin (falling back to ~/.local/bin).
      security: []
      responses:
        "200":
          description: POSIX install script
          content:
            text/x-shellscript:
              schema:
                type: string

  /openapi/v1/cli/download/{platform}:
    get:
      tags: [cli]
      summary: Download the arena CLI binary for a platform
      description: >
        Public. Streams the platform binary from OSS (or 302-redirects when the
        release references an absolute URL). platform is a GOOS-GOARCH token,
        e.g. darwin-arm64 or linux-amd64.
      security: []
      parameters:
        - name: platform
          in: path
          required: true
          schema:
            type: string
          example: darwin-arm64
      responses:
        "200":
          description: Binary stream
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "302":
          description: Redirect to an absolute download URL
        "404":
          description: No release, or platform not available in the release
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /openapi/v1/uploads:
    post:
      tags: [system]
      summary: Stage a file (or unpacked zip directory) and get its uploads/ URI
      description: >
        Multipart upload into the OSS scratch area. Reference the returned
        prefix-relative URI from any spec field; publish-time materialization
        copies the bytes into the immutable registry prefix. Send `unpack=zip`
        to unpack a zip archive into a directory URI (trailing slash).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: File content (max 256 MB).
                unpack:
                  type: string
                  enum: [zip]
                  description: Unpack the uploaded zip into a directory URI.
                storage_ref:
                  $ref: "#/components/schemas/StorageRef"
      responses:
        "201":
          description: Staged upload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResult"
        default:
          $ref: "#/components/responses/Error"

  /openapi/v1/oss-storages:
    get:
      tags: [system]
      summary: List configured OSS backends
      description: Returns the immutable environment-backed default plus database-managed additional backends. Credentials are always masked.
      responses:
        "200":
          description: OSS storage list
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/OSSStorage"
                  total:
                    type: integer
        default:
          $ref: "#/components/responses/Error"
    post:
      tags: [system]
      summary: Create an additional OSS backend (root only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OSSStorageRequest"
      responses:
        "201":
          description: OSS storage created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OSSStorage"
        default:
          $ref: "#/components/responses/Error"

  /openapi/v1/oss-storages/{storage_id}:
    parameters:
      - name: storage_id
        in: path
        required: true
        schema:
          type: string
    patch:
      tags: [system]
      summary: Update an additional OSS backend (root only)
      description: Bucket, endpoint, prefix, and mount_id become immutable after any Registry version references the backend. Credentials may still be rotated.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OSSStorageRequest"
      responses:
        "200":
          description: OSS storage updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OSSStorage"
        default:
          $ref: "#/components/responses/Error"
    delete:
      tags: [system]
      summary: Delete an unreferenced additional OSS backend (root only)
      responses:
        "204":
          description: Deleted
        default:
          $ref: "#/components/responses/Error"

  /openapi/v1/oss-storages/{storage_id}/test:
    post:
      tags: [system]
      summary: Probe OSS read/write connectivity (root only)
      parameters:
        - name: storage_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Probe succeeded
          content:
            application/json:
              schema:
                type: object
                required: [ok, storage_id, latency_ms]
                properties:
                  ok:
                    type: boolean
                  storage_id:
                    type: string
                  latency_ms:
                    type: integer
                    format: int64
        default:
          $ref: "#/components/responses/Error"

  /openapi/v1/uploads/presign:
    post:
      tags: [system]
      summary: Get presigned PUT URLs for a direct (client → OSS) upload
      description: >
        Declares an upload manifest and receives one presigned PUT URL per
        file under a server-generated scratch base. Clients PUT bytes straight
        to OSS (send exactly the returned headers; Content-MD5 is part of the
        signature) and then call /openapi/v1/uploads/complete. Answers 501
        when direct upload is disabled (OSS_PRESIGN_ENDPOINT unset); fall back
        to the legacy multipart POST /openapi/v1/uploads.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadManifest"
      responses:
        "201":
          description: Presigned upload targets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadPresignResult"
        default:
          $ref: "#/components/responses/Error"

  /openapi/v1/uploads/complete:
    post:
      tags: [system]
      summary: Verify a direct upload and get its final uploads/ URI
      description: >
        Re-declares the manifest for a presigned upload. The server lists the
        scratch base and requires an exact match (every manifest file present
        with its declared size, nothing else); mismatches answer 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadManifest"
      responses:
        "201":
          description: Completed upload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResult"
        default:
          $ref: "#/components/responses/Error"

  /api/runtime-config:
    get:
      tags: [system]
      summary: Get public runtime configuration for the web UI
      description: Returns the public service origin used by the Registry Skill to render absolute OpenAPI URLs.
      security: []
      responses:
        "200":
          description: Runtime configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeConfig"

  /openapi/v1/recovery:
    post:
      tags: [recovery]
      summary: Recover interrupted Jobs after process restart
      responses:
        "202":
          description: Recovery scan accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryResult"
        default:
          $ref: "#/components/responses/Error"

  /openapi/v1/envs:
    get:
      tags: [envs]
      summary: List Env keys
      parameters:
        - $ref: "#/components/parameters/StatusQuery"
        - $ref: "#/components/parameters/TagQuery"
        - $ref: "#/components/parameters/RegistryKeysQuery"
        - $ref: "#/components/parameters/RegistrySearchQuery"
        - $ref: "#/components/parameters/CreatedByQuery"
        - $ref: "#/components/parameters/EnvDatasetTaskQuery"
        - $ref: "#/components/parameters/EnvPartitionQuery"
        - $ref: "#/components/parameters/RegistryLimitQuery"
        - $ref: "#/components/parameters/RegistryOffsetQuery"
      responses:
        "200":
          description: Env list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvListResponse"
        default:
          $ref: "#/components/responses/Error"
    post:
      tags: [envs]
      summary: Create an Env key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEntityRequest"
      responses:
        "201":
          description: Env created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Env"
        default:
          $ref: "#/components/responses/Error"

  /openapi/v1/envs/versions:
    get:
      tags: [envs]
      summary: List Env versions across entity keys
      parameters:
        - $ref: "#/components/parameters/StatusQuery"
        - $ref: "#/components/parameters/RegistryKeysQuery"
        - $ref: "#/components/parameters/CreatedByQuery"
        - $ref: "#/components/parameters/RegistryLimitQuery"
        - $ref: "#/components/parameters/RegistryOffsetQuery"
      responses:
        "200":
          description: Env version metadata list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistryVersionListResponse"
        default:
          $ref: "#/components/responses/Error"

  /openapi/v1/envs/{key}:
    get:
      tags: [envs]
      summary: Get an Env key
      parameters:
        - $ref: "#/components/parameters/EnvKey"
      responses:
        "200":
          description: Env
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Env"
        default:
          $ref: "#/components/responses/Error"
    patch:
      tags: [envs]
      summary: Update Env display metadata
      parameters:
        - $ref: "#/components/parameters/EnvKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEntityRequest"
      responses:
        "200":
          description: Env updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Env"
        default:
          $ref: "#/components/responses/Error"
    delete:
      tags: [envs]
      summary: Soft-delete an Env key
      description: Marks the Env as DELETED; normal reads hide it. Only root or the creator may delete it.
      parameters:
        - $ref: "#/components/parameters/EnvKey"
      responses:
        "204":
          description: Env deleted
        default:
          $ref: "#/components/responses/Error"

  /openapi/v1/envs/{key}/versions:
    get:
      tags: [envs]
      summary: List Env versions
      parameters:
        - $ref: "#/components/parameters/EnvKey"
        - $ref: "#/components/parameters/StatusQuery"
      responses:
        "200":
          description: Env versions
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/EnvVersion"
        default:
          $ref: "#/components/responses/Error"
    post:
      tags: [envs]
      summary: Create a draft Env version
      parameters:
        - $ref: "#/components/parameters/EnvKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEnvVersionRequest"
      responses:
        "201":
          description: Env version created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvVersion"
        default:
          $ref: "#/components/responses/Error"

  /openapi/v1/envs/{key}/versions/{version}:
    get:
      tags: [envs]
      summary: Get an Env version
      parameters:
        - $ref: "#/components/parameters/EnvKey"
        - $ref: "#/components/parameters/Version"
      responses:
        "200":
          description: Env version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvVersion"
        default:
          $ref: "#/components/responses/Error"
    patch:
      tags: [envs]
      summary: Update a draft Env version
      parameters:
        - $ref: "#/components/parameters/EnvKey"
        - $ref: "#/components/parameters/Version"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEnvVersionRequest"
      responses:
        "200":
          description: Env draft updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvVersion"
        default:
          $ref: "#/components/responses/Error"
    delete:
      tags: [envs]
      summary: Soft-delete an Env version
      description: Marks the version as DELETED while retaining its immutable spec.
      parameters:
        - $ref: "#/components/parameters/EnvKey"
        - $ref: "#/components/parameters/Version"
      responses:
        "204":
          description: Env version deleted
        default:
          $ref: "#/components/responses/Error"

  /openapi/v1/envs/{key}/versions/{version}/publish:
    post:
      tags: [envs]
      summary: Publish an immutable Env version
      description: Requires query.uri, runtime, timeout_seconds, and bundle.uri when runtime.kind=files.
      parameters:
        - $ref: "#/components/parameters/EnvKey"
        - $ref: "#/components/parameters/Version"
      responses:
        "200":
          description: Published Env version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvVersion"
        default:
          $ref: "#/components/responses/Error"

  /openapi/v1/envs/{key}/versions/{version}/deprecate:
    post:
      tags: [envs]
      summary: Deprecate a published Env version
      parameters:
        - $ref: "#/components/parameters/EnvKey"
        - $ref: "#/components/parameters/Version"
      responses:
        "200":
          description: Deprecated Env version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvVersion"
        default:
          $ref: "#/components/responses/Error"

  /openapi/v1/envs/{key}/versions/{version}/archive:
    post:
      tags: [envs]
      summary: Archive an Env version
      parameters:
        - $ref: "#/components/parameters/EnvKey"
        - $ref: "#/components/parameters/Version"
      responses:
        "200":
          description: Archived Env version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvVersion"
        default:
          $ref: "#/components/responses/Error"

  /openapi/v1/harnesses:
    get:
      tags: [harnesses]
      summary: List Harness keys
      parameters:
        - $ref: "#/components/parameters/StatusQuery"
        - $ref: "#/components/parameters/TagQuery"
        - $ref: "#/components/parameters/RegistryKeysQuery"
        - $ref: "#/components/parameters/RegistrySearchQuery"
        - $ref: "#/components/parameters/CreatedByQuery"
        - $ref: "#/components/parameters/RegistryLimitQuery"
        - $ref: "#/components/parameters/RegistryOffsetQuery"
      responses:
        "200":
          description: Harness list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HarnessListResponse"
        default:
          $ref: "#/components/responses/Error"
    post:
      tags: [harnesses]
      summary: Create a Harness key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEntityRequest"
      responses:
        "201":
          description: Harness created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Harness"
        default:
          $ref: "#/components/responses/Error"

  /openapi/v1/harnesses/versions:
    get:
      tags: [harnesses]
      summary: List Harness versions across entity keys
      parameters:
        - $ref: "#/components/parameters/StatusQuery"
        - $ref: "#/components/parameters/RegistryKeysQuery"
        - $ref: "#/components/parameters/CreatedByQuery"
        - $ref: "#/components/parameters/RegistryLimitQuery"
        - $ref: "#/components/parameters/RegistryOffsetQuery"
      responses:
        "200":
          description: Harness version metadata list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistryVersionListResponse"
        default:
          $ref: "#/components/responses/Error"

  /openapi/v1/harnesses/{key}:
    get:
      tags: [harnesses]
      summary: Get a Harness key
      parameters:
        - $ref: "#/components/parameters/HarnessKey"
      responses:
        "200":
          description: Harness
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Harness"
        default:
          $ref: "#/components/responses/Error"
    patch:
      tags: [harnesses]
      summary: Update Harness display metadata
      parameters:
        - $ref: "#/components/parameters/HarnessKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEntityRequest"
      responses:
        "200":
          description: Harness updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Harness"
        default:
          $ref: "#/components/responses/Error"
    delete:
      tags: [harnesses]
      summary: Soft-delete a Harness key
      description: Marks the Harness as DELETED; normal reads hide it. Only root or the creator may delete it.
      parameters:
        - $ref: "#/components/parameters/HarnessKey"
      responses:
        "204":
          description: Harness deleted
        default:
          $ref: "#/components/responses/Error"

  /openapi/v1/harnesses/{key}/versions:
    get:
      tags: [harnesses]
      summary: List Harness versions
      parameters:
        - $ref: "#/components/parameters/HarnessKey"
        - $ref: "#/components/parameters/StatusQuery"
      responses:
        "200":
          description: Harness versions
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/HarnessVersion"
        default:
          $ref: "#/components/responses/Error"
    post:
      tags: [harnesses]
      summary: Create a draft Harness version
      parameters:
        - $ref: "#/components/parameters/HarnessKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateHarnessVersionRequest"
      responses:
        "201":
          description: Harness version created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HarnessVersion"
        default:
          $ref: "#/components/responses/Error"

  /openapi/v1/harnesses/{key}/versions/{version}:
    get:
      tags: [harnesses]
      summary: Get a Harness version
      parameters:
        - $ref: "#/components/parameters/HarnessKey"
        - $ref: "#/components/parameters/Version"
      responses:
        "200":
          description: Harness version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HarnessVersion"
        default:
          $ref: "#/components/responses/Error"
    patch:
      tags: [harnesses]
      summary: Update a draft Harness version
      parameters:
        - $ref: "#/components/parameters/HarnessKey"
        - $ref: "#/components/parameters/Version"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateHarnessVersionRequest"
      responses:
        "200":
          description: Harness draft updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HarnessVersion"
        default:
          $ref: "#/components/responses/Error"
    delete:
      tags: [harnesses]
      summary: Soft-delete a Harness version
      description: Marks the version as DELETED while retaining its immutable spec.
      parameters:
        - $ref: "#/components/parameters/HarnessKey"
        - $ref: "#/components/parameters/Version"
      responses:
        "204":
          description: Harness version deleted
        default:
          $ref: "#/components/responses/Error"

  /openapi/v1/harnesses/{key}/versions/{version}/publish:
    post:
      tags: [harnesses]
      summary: Publish an immutable Harness version
      description: Requires runtime.type, runtime.uri, ttl_seconds, valid optional material refs, and published tool_refs / skill_refs.
      parameters:
        - $ref: "#/components/parameters/HarnessKey"
        - $ref: "#/components/parameters/Version"
      responses:
        "200":
          description: Published Harness version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HarnessVersion"
        default:
          $ref: "#/components/responses/Error"

  /openapi/v1/harnesses/{key}/versions/{version}/deprecate:
    post:
      tags: [harnesses]
      summary: Deprecate a published Harness version
      parameters:
        - $ref: "#/components/parameters/HarnessKey"
        - $ref: "#/components/parameters/Version"
      responses:
        "200":
          description: Deprecated Harness version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HarnessVersion"
        default:
          $ref: "#/components/responses/Error"

  /openapi/v1/harnesses/{key}/versions/{version}/archive:
    post:
      tags: [harnesses]
      summary: Archive a Harness version
      parameters:
        - $ref: "#/components/parameters/HarnessKey"
        - $ref: "#/components/parameters/Version"
      responses:
        "200":
          description: Archived Harness version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HarnessVersion"
