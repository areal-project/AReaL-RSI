<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bookmarks</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f7fb;color:#172033;font:16px system-ui,-apple-system,Segoe UI,sans-serif}.app{max-width:800px;margin:auto;padding:28px 16px 48px}h1{margin:0 0 18px;font-size:clamp(1.6rem,5vw,2.2rem)}form.add{display:grid;grid-template-columns:2fr 3fr auto;gap:10px;margin-bottom:12px}input,button{font:inherit;min-height:34px}input{width:100%;padding:8px 10px;border:1px solid #c9ceda;border-radius:7px}button{padding:7px 12px;border:1px solid #b8bfcc;border-radius:7px;background:#fff;cursor:pointer}button:hover{background:#e9edf5}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 18px}.filters .selected{background:#2563eb;color:#fff;border-color:#2563eb}ul{list-style:none;padding:0;margin:0;display:grid;gap:10px}.row{display:grid;grid-template-columns:30px minmax(0,1fr) auto auto;align-items:center;gap:10px;min-height:56px;padding:10px 12px;background:#fff;border:1px solid #e1e5ec;border-radius:10px}.row .name{min-width:0;overflow-wrap:anywhere}.row a{display:block;color:#2563eb;overflow-wrap:anywhere}.row.completed a{text-decoration:line-through;color:#64748b}.row .star{color:#a16207;font-size:13px}.edit-form{display:flex;gap:7px;min-width:0}.edit-form input{min-width:0}.error{min-height:24px;color:#b42318;font-size:.9rem;margin:4px 0}.empty{color:#64748b}.check{width:24px;height:24px;min-height:24px}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@media(max-width:560px){.app{padding:22px 12px 36px}form.add{grid-template-columns:1fr}.row{grid-template-columns:28px minmax(0,1fr) auto;gap:8px}.row .actions{grid-column:2/-1;display:flex;justify-content:flex-end;gap:7px}.row .edit-form{grid-column:2/-1}.row .star{display:none}}
</style></head><body><main class="app"><h1>Bookmarks</h1><form id="add-form" class="add" novalidate><input id="title-input" data-testid="title-input" aria-label="Title" placeholder="Title"><input id="url-input" data-testid="url-input" aria-label="URL" placeholder="https://example.com"><button data-testid="add" type="submit">Add bookmark</button></form><p id="error" class="error" role="alert"></p><nav class="filters" aria-label="Filter bookmarks"><button type="button" data-testid="filter-all" data-filter="all" class="selected">All</button><button type="button" data-testid="filter-active" data-filter="active">Active</button><button type="button" data-testid="filter-completed" data-filter="completed">Completed</button></nav><ul id="list"></ul></main><script>
(function(){'use strict';const KEY='bookmark-app-v1';let items=[],filter='all';const $=s=>document.querySelector(s),list=$('#list'),error=$('#error');try{items=JSON.parse(localStorage.getItem(KEY))||[]}catch(e){items=[]}function persist(){localStorage.setItem(KEY,JSON.stringify(items))}function validUrl(value){try{const u=new URL(value.trim());return u.protocol==='http:'||u.protocol==='https:'}catch(e){return false}}function render(){list.textContent='';let shown=items.filter(x=>filter==='all'||(filter==='active'&&!x.starred)||(filter==='completed'&&x.starred));if(!shown.length){const e=document.createElement('li');e.className='empty';e.textContent='No bookmarks here yet.';list.append(e)}shown.forEach((item)=>{const idx=items.indexOf(item),row=document.createElement('li');row.className='row'+(item.starred?' completed':'');row.dataset.testid='item';const check=document.createElement('input');check.type='checkbox';check.className='check';check.dataset.testid='toggle';check.checked=!!item.starred;check.setAttribute('aria-label','Complete bookmark');check.onchange=()=>{item.starred=check.checked;persist();render()};row.append(check);const content=document.createElement('div');content.className='name';const a=document.createElement('a');a.href=item.url;a.textContent=item.title;a.target='_blank';a.rel='noopener noreferrer';content.append(a);row.append(content);const actions=document.createElement('div');actions.className='actions';const edit=document.createElement('button');edit.type='button';edit.dataset.testid='edit';edit.textContent='Edit';edit.onclick=()=>editRow(row,item);actions.append(edit);const del=document.createElement('button');del.type='button';del.dataset.testid='delete';del.textContent='Delete';del.onclick=()=>{items.splice(idx,1);persist();render()};actions.append(del);row.append(actions);list.append(row)})}function editRow(row,item){const content=row.querySelector('.name'),form=document.createElement('form');form.className='edit-form';const inp=document.createElement('input');inp.dataset.testid='edit-input';inp.value=item.title;inp.setAttribute('aria-label','Edit title');const save=document.createElement('button');save.type='submit';save.dataset.testid='save';save.textContent='Save';form.append(inp,save);form.onsubmit=e=>{e.preventDefault();const v=inp.value.trim();if(!v){inp.focus();return}item.title=v;persist();render()};content.replaceChildren(form);inp.focus()}$('#add-form').onsubmit=e=>{e.preventDefault();error.textContent='';const title=$('#title-input').value.trim(),url=$('#url-input').value.trim();if(!title){error.textContent='Please enter a title.';return}if(!validUrl(url)){error.textContent='Please use a valid http or https URL.';return}items.push({id:Date.now()+Math.random(),title,url,starred:false});persist();$('#title-input').value='';$('#url-input').value='';render();$('#title-input').focus()};document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('selected',x===b));render()});render()})();
</script></body></html>
