# Deployment settings for AReaL Experience OPD (nested-Slurm driver).
#
# OPD is launched by reusing AReaL's checked-in CPU driver sbatch: the RSI
# wrapper sets the driver's environment contract and submits it with
# `sbatch --parsable`, then waits (squeue only, no sacct) until the driver job
# leaves the queue and resolves the saved checkpoint. AReaL's own scheduler
# allocates the colocated actor/rollout/teacher workers inside the run.
#
# Per-iteration inputs are supplied by the RSI loop as MODEL_PATH (current
# checkpoint), EXPERIENCE_PATH (Researcher experience map) and TRAIN_DATA. The
# deployment paths below are set here; SECRETS (AENV_SYSTEM_URL, WANDB_API_KEY,
# WANDB_BASE_URL, PYPI_INDEX_URL, ...) must be present in the process
# environment at launch time and are NOT stored here.
areal:
  opd:
    scheduler_type: slurm
    working_directory: /storage/openpsi/users/fenghui/AReaL
    driver_script: examples/mopd/sbatch_experience_opd_qwen3_30b_2node.sh
    # fileroot + experiment_name must match the recipe so the wrapper resolves
    # <fileroot>/checkpoints/<user>/<experiment_name>/<trial>/default.
    fileroot: /storage/openpsi/rsi-experiments/swe-exp-opd
    experiment_name: swe-experience-opd
    # 2-node variant (swe_experience_opd_2node_qwen3_30b.yaml, 2x8=16 GPU).
    n_nodes: 2
    n_gpus_per_node: 8
    environment_variables:
      AREAL_IMAGE: /storage/openpsi/images/areal-dev-20260508.sif
      # Set these to your checkouts (required by the driver script):
      AWEAGENT_ROOT: /storage/openpsi/users/fenghui/projects/AWEAgent
      AWEX_ROOT: /storage/openpsi/users/fenghui/projects/AWEX
      SGLANG_PYTHON_ROOT: /storage/openpsi/users/fenghui/projects/sglang/python
      FLASH_LINEAR_ATTENTION_ROOT: /storage/openpsi/users/fenghui/projects/flash-linear-attention
    poll_interval_seconds: 60
    job_timeout_seconds: 604800
