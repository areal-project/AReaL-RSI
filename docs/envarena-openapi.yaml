                    description: Experiment of the newest task, which is the default scope of the task and stats endpoints.
        default:
          $ref: "#/components/responses/Error"

  /openapi/v1/streams/{stream_id}/events:
    get:
      tags: [streams]
      summary: List Stream configuration change events
      description: Contains Stream create, update, archive, and delete changes only; task lifecycle events are intentionally excluded.
      parameters:
        - $ref: "#/components/parameters/StreamID"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 100
      responses:
        "200":
          description: Stream events
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/StreamEvent"
        default:
          $ref: "#/components/responses/Error"

  /openapi/v1/jobs:
    get:
      tags: [jobs]
