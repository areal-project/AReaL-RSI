    EnvSpec:
      type: object
      required: [query, runtime, timeout_seconds]
      description: Env can be files-backed or image-backed. The agent workspace is ARENA_WORKSPACE=/envarena/workspace; OSS-backed platform mounts are namespaced under /envarena/ (query, files, out, result, oracle).
      properties:
        query:
          $ref: "#/components/schemas/ObjectRef"
        bundle:
          $ref: "#/components/schemas/ObjectRef"
          description: Required when runtime.kind=files.
        oracle:
          $ref: "#/components/schemas/ObjectRef"
        oracle_schema:
          type: string
          example: feiji.oracle.v1
        runtime:
          $ref: "#/components/schemas/EnvRuntimeSpec"
        query_path:
          type: string
          default: /workspace/Target.md
          description: Defaults to /workspace/Target.md.
        workdir:
          type: string
          description: Absolute agent working directory for image Envs. Defaults to the image configured working directory.
          example: /testbed
        timeout_seconds:
          type: integer
          minimum: 1
          default: 600
        tags:
          type: array
          items:
            type: string
        resource_hints:
          $ref: "#/components/schemas/ResourceSpec"
        metadata:
          type: object
          additionalProperties: true
        data_source:
          description: Optional object-store materialization override.
          $ref: "#/components/schemas/DataSource"

    EnvRuntimeSpec:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [files, image]
        image:
          type: string
          description: Required when kind=image. This is the user-provided Env image.
          example: registry.example/envs/programbench-env:1.0.0
        profile:
          type: string
          description: Required when kind=image. Public runtime option key such as image_networked or image_offline.
          example: image_networked
        command:
          type: string
          description: Optional keepalive command for image runtimes. Defaults to sleep infinity.

    RuntimeImage:
      type: object
      required: [kind, ref]
      properties:
        kind:
          type: string
          enum: [container_image]
        ref:
          type: string
          example: registry.example/rewards/visual-reward:1.0.0
        command:
          type: string
          description: Optional container startup command. For container_image, Arena defaults to sleep infinity so the sandbox stays alive for exec.
          example: sleep infinity

