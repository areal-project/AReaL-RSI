[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "areal-rsi"
version = "0.1.0"
description = "Automated research and training loop for recursive model improvement with AReaL and EnvArena."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "attrs>=23.2",
    "httpx>=0.27,<1",
    "python-dateutil>=2.8.2",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
agent = [
    "openai>=2.0.0",
]
researcher = [
    "claude-agent-sdk>=0.1.48",
]
dev = [
    "pytest>=8",
]
codegen = [
    "openapi-python-client==0.28.0",
]

[project.scripts]
areal-rsi = "areal_rsi.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["areal_rsi*"]
