# Deployment settings for AReaLService. Model, data, and training resources
# remain in the AReaL training YAML passed through train_config_path.
areal:
  sft:
    # The complete command that accepts `--config <training-yaml>`.
    # Use a different command/entrypoint here for a different AReaL driver.
    # The Slurm wrapper already prepends torchrun, so this must be the Python
    # training entrypoint rather than the `areal` console command.
    commands: [examples/swe/train_sft.py]
    scheduler_type: slurm
    environment_variables: {}
    slurm:
      image: /storage/openpsi/images/areal-dev-20260508.sif
      working_directory: /storage/openpsi/users/xuruida.xrd/AReaL
      cpus_per_task: 64
      memory: 400G
      time_limit: "04:00:00"
      bind_paths: [/storage]
      container_environment: {}
      # partition/account intentionally omitted; Slurm defaults apply.
      reservation: rsi
