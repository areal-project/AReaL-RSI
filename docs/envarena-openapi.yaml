        gateway_ref:
          type: string
          description: Server-side eval gateway reference resolved from ARENA_EVAL_GATEWAY_<REF>_URL, with ARENA_MODEL_GATEWAY_<REF>_URL and ARENA_GATEWAY_<REF>_URL as fallbacks.
        credential_ref:
          type: string
          description: Server-side eval credential reference resolved from ARENA_EVAL_CREDENTIAL_<REF>_API_KEY, with ARENA_MODEL_CREDENTIAL_<REF>_API_KEY and ARENA_CREDENTIAL_<REF>_API_KEY as fallbacks.
        parameters:
          type: object
          additionalProperties: true
    RewardSpec:
      type: object
      required: [runtime_image, entrypoint, score_schema, ttl_seconds]
      properties:
        runtime_image:
          $ref: "#/components/schemas/RuntimeImage"
        entrypoint:
          type: string
        io_contract:
          $ref: "#/components/schemas/IOContract"
        score_schema:
          $ref: "#/components/schemas/ScoreSchema"
        accepted_oracle_schema:
          type: string
        eval_model:
          $ref: "#/components/schemas/EvalModelSpec"
        resource_spec:
          $ref: "#/components/schemas/ResourceSpec"
        ttl_seconds:
          type: integer
          minimum: 1
        metadata:
          type: object
          additionalProperties: true
    BenchmarkEnvRef:
      type: object
      required: [env_ref]
      properties:
        env_ref:
          $ref: "#/components/schemas/VersionRef"
        weight:
          type: number
          default: 1
        params:
          type: object
          additionalProperties: true
    AggregationSpec:
      type: object
      required: [method]
      properties:
        method:
          type: string
          enum: [mean, weighted_mean, pass_at_k]
        failed_task_policy:
          type: string
          enum: [failed_as_zero, exclude_failed]
          default: failed_as_zero
        min_success_rate:
          type: number
          minimum: 0
          maximum: 1
        pass_threshold:
          type: number
          minimum: 0
          maximum: 1
        params:
          type: object
          additionalProperties: true
    BenchmarkSpec:
      type: object
      description: >
        Benchmark binds one published Reward to one or more published Envs. When both sides declare oracle schemas, Reward accepted_oracle_schema must match each Env oracle_schema at publish/job creation time.

      required: [reward_ref, env_refs, aggregation]
      properties:
        reward_ref:
          $ref: "#/components/schemas/VersionRef"
        env_refs:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/BenchmarkEnvRef"
        aggregation:
          $ref: "#/components/schemas/AggregationSpec"
        tags:
          type: array
          items:
            type: string
        metadata:
          type: object
          additionalProperties: true
    VersionMeta:
      type: object
      required: [key, version, status, created_at]
      properties:
        key:
          type: string
        version:
          type: string
        status:
          $ref: "#/components/schemas/EntityStatus"
        content_hash:
          type: string
        supersedes:
          type: string
        created_at:
          type: string
          format: date-time
        created_by:
          type: string
        published_at:
          type: string
          format: date-time
        published_by:
          type: string
    EnvVersion:
      allOf:
        - $ref: "#/components/schemas/VersionMeta"
        - type: object
          required: [spec]
          properties:
            spec:
              $ref: "#/components/schemas/EnvSpec"
    HarnessVersion:
      allOf:
        - $ref: "#/components/schemas/VersionMeta"
        - type: object
          required: [spec]
          properties:
            spec:
              $ref: "#/components/schemas/HarnessSpec"
    ToolVersion:
      allOf:
        - $ref: "#/components/schemas/VersionMeta"
        - type: object
          required: [spec]
          properties:
            spec:
              $ref: "#/components/schemas/ToolSpec"
    SkillVersion:
      allOf:
        - $ref: "#/components/schemas/VersionMeta"
        - type: object
          required: [spec]
          properties:
            spec:
              $ref: "#/components/schemas/SkillSpec"
    RewardVersion:
      allOf:
        - $ref: "#/components/schemas/VersionMeta"
        - type: object
          required: [spec]
          properties:
            spec:
              $ref: "#/components/schemas/RewardSpec"
    BenchmarkVersion:
      allOf:
        - $ref: "#/components/schemas/VersionMeta"
        - type: object
          required: [spec]
          properties:
            spec:
              $ref: "#/components/schemas/BenchmarkSpec"
    ModelVersion:
      allOf:
        - $ref: "#/components/schemas/VersionMeta"
        - type: object
          required: [spec]
          properties:
            spec:
              $ref: "#/components/schemas/ModelSpec"
    CreateEnvVersionRequest:
      type: object
      required: [version, spec]
      properties:
        version:
          type: string
        supersedes:
          type: string
        spec:
          $ref: "#/components/schemas/EnvSpec"
    UpdateEnvVersionRequest:
      type: object
      properties:
        spec:
          $ref: "#/components/schemas/EnvSpec"
    CreateHarnessVersionRequest:
      type: object
      required: [version, spec]
      properties:
        version:
          type: string
        supersedes:
          type: string
        spec:
          $ref: "#/components/schemas/HarnessSpec"
    UpdateHarnessVersionRequest:
      type: object
      properties:
        spec:
          $ref: "#/components/schemas/HarnessSpec"
    CreateToolVersionRequest:
      type: object
      required: [version, spec]
      properties:
        version:
          type: string
        supersedes:
          type: string
        spec:
          $ref: "#/components/schemas/ToolSpec"
    UpdateToolVersionRequest:
      type: object
      properties:
        spec:
          $ref: "#/components/schemas/ToolSpec"
    CreateSkillVersionRequest:
      type: object
      required: [version, spec]
      properties:
        version:
          type: string
        supersedes:
          type: string
        spec:
          $ref: "#/components/schemas/SkillSpec"
    UpdateSkillVersionRequest:
      type: object
      properties:
        spec:
          $ref: "#/components/schemas/SkillSpec"
    CreateRewardVersionRequest:
      type: object
      required: [version, spec]
      properties:
        version:
          type: string
        supersedes:
          type: string
        spec:
          $ref: "#/components/schemas/RewardSpec"
    UpdateRewardVersionRequest:
      type: object
      properties:
        spec:
          $ref: "#/components/schemas/RewardSpec"
    CreateBenchmarkVersionRequest:
      type: object
      required: [version, spec]
      properties:
        version:
          type: string
        supersedes:
          type: string
        spec:
          $ref: "#/components/schemas/BenchmarkSpec"
    UpdateBenchmarkVersionRequest:
      type: object
      properties:
        spec:
          $ref: "#/components/schemas/BenchmarkSpec"
    CreateModelVersionRequest:
      type: object
      required: [version, spec]
      properties:
        version:
          type: string
        supersedes:
          type: string
        spec:
          $ref: "#/components/schemas/ModelSpec"
    UpdateModelVersionRequest:
      type: object
      properties:
        spec:
          $ref: "#/components/schemas/ModelSpec"
    ModelSpec:
      type: object
      additionalProperties: true
      description: Compact model runtime config. EnvArena recognizes model_name, parameters, and env; unknown fields are preserved but are not used for routing.
      required: [model_name]
      properties:
        model_name:
          type: string
          example: playforge_glm
        parameters:
          type: object
          additionalProperties: true
        env:
          type: object
          description: Environment variables injected into Harness sandbox and Env image sandbox. Put model gateway and credentials here for now. ARENA_*, OTEL_*, TRACEPARENT/TRACESTATE, Claude Code telemetry controls, and IS_SANDBOX are reserved and cannot be overridden.
          additionalProperties:
            type: string
    ConcurrencyPolicy:
      type: object
      properties:
        max_parallel:
          type: integer
          minimum: 1
          default: 1
        max_retries:
          type: integer
          minimum: 0
          default: 0
        retry_backoff_seconds:
          type: integer
          minimum: 0
          default: 30
    CreateJobRequest:
      type: object
      required: [benchmark_ref, harness_ref]
      properties:
        job_id:
          type: string
          description: Optional readable Job short name, for example programbench. The server appends -YYMMDDHHMM; if omitted, it uses job-YYMMDDHHMM. A short numeric suffix resolves same-minute collisions.
          example: programbench
        benchmark_ref:
          $ref: "#/components/schemas/VersionRef"
        harness_ref:
          $ref: "#/components/schemas/VersionRef"
        model_ref:
          $ref: "#/components/schemas/VersionRef"
          description: Optional published Model@v. If supplied, the Job pins this model version and copies its spec into each Task.
        model:
          $ref: "#/components/schemas/ModelSpec"
          description: Inline model config. If model_ref is also supplied, non-empty inline fields override the referenced spec.
        sample_numbers:
          type: integer
          minimum: 1
          default: 1
          description: pass@k sample count. Each Env fans out into this many independent Tasks.
        concurrency_policy:
          $ref: "#/components/schemas/ConcurrencyPolicy"
        tags:
          type: array
          description: Selection and search labels attached to this Job.
          items:
            type: string
        metadata:
          type: object
          additionalProperties:
            type: string
    BenchmarkJob:
      type: object
      required: [job_id, harness_key, env_keys, concurrency, sample_numbers, status, created_at]
      properties:
        job_id:
          type: string
          description: Readable Job name, normally short-name-YYMMDDHHMM.
        kind:
          type: string
          enum: [BENCHMARK, RESCORE]
          default: BENCHMARK
          description: BENCHMARK is a normal Agent run; RESCORE is a derived, reward-only run.
        source_job_id:
          type: string
          description: Set only for RESCORE Jobs; identifies the immutable source Benchmark Job.
        source_generation:
          type: integer
          minimum: 1
          description: Execution generation of the source Job whose products are reused.
        effective_reward_ref:
          $ref: "#/components/schemas/VersionRef"
          description: Reward actually used by this Job. Set for RESCORE Jobs.
        harness_key:
          type: string
        env_keys:
          type: array
          items:
            type: string
        benchmark_ref:
          $ref: "#/components/schemas/VersionRef"
        harness_ref:
          $ref: "#/components/schemas/VersionRef"
        model_ref:
          $ref: "#/components/schemas/VersionRef"
        model:
          $ref: "#/components/schemas/ModelSpec"
        concurrency:
          type: integer
          minimum: 1
        sample_numbers:
          type: integer
          minimum: 1
        max_retries:
          type: integer
          minimum: 0
        retry_backoff_seconds:
          type: integer
          minimum: 0
        config_revision:
          type: integer
          format: int64
          minimum: 0
          description: |
            Optimistic-lock counter for the runtime-mutable settings
            (max_parallel/concurrency, max_retries, retry_backoff_seconds).
            Incremented on every successful PATCH .../config; the PATCH must
            present the revision it read or it is rejected with 409.
        execution_generation:
          type: integer
          minimum: 1
          description: |
            Manual-retry round counter. 1 is the original submission; each
            POST .../retry archives the previous round into the execution
            history and bumps this value.
        status:
          $ref: "#/components/schemas/JobStatus"
        avg_score:
          type: number
          nullable: true
        task_counts:
          $ref: "#/components/schemas/JobTaskCounts"
        created_at:
          type: string
          format: date-time
        tags:
          type: array
          description: Selection and search labels attached to this Job.
          items:
            type: string
        metadata:
          type: object
          additionalProperties:
            type: string
    JobTaskCounts:
      type: object
      required: [total, done, failed, running, pending]
      properties:
        total:
          type: integer
          minimum: 0
        done:
          type: integer
          minimum: 0
        failed:
          type: integer
          minimum: 0
        running:
          type: integer
          minimum: 0
        pending:
          type: integer
          minimum: 0
        cancelled:
          type: integer
          minimum: 0
          description: |
            Subset of failed whose status is CANCELLED (tasks parked by
            stop/cancel, not genuine failures). Manual retry mode=failed
            skips them; failed - cancelled is the retry-failed candidate
            count.
    JobSummaryResponse:
      type: object
      required: [job, task_counts, env_count]
      properties:
        job:
          $ref: "#/components/schemas/BenchmarkJob"
        result:
          $ref: "#/components/schemas/JobResult"
        task_counts:
          $ref: "#/components/schemas/JobTaskCounts"
        env_count:
          type: integer
          minimum: 0
        reward_ref:
          $ref: "#/components/schemas/VersionRef"
        sample_summary:
          type: array
          items:
            $ref: "#/components/schemas/JobSampleSummary"
    JobSampleSummary:
      type: object
      required: [sample_index, pass_count, total, pass_rate]
      properties:
        sample_index:
          type: integer
          minimum: 0
        pass_count:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 0
        pass_rate:
          type: number
          minimum: 0
          maximum: 1
    JobEnvSummary:
      type: object
      required:
        - env
        - env_key
        - env_label
        - status
        - weight
        - count
        - total
        - done_count
        - failed_count
        - running_count
        - pending_count
        - completed_count
        - task_count
        - visible_task_count
        - progress
        - total_duration_ms
        - avg_duration_ms
      properties:
        env:
          type: string
        env_key:
          type: string
          description: Stable Env grouping key, normally Env@version when env_ref is present.
        env_label:
          type: string
        env_ref:
          $ref: "#/components/schemas/VersionRef"
        status:
          type: string
          enum: [DONE, FAILED, RUNNING, PENDING, PARTIAL]
        weight:
          type: number
        aggregate_score:
          type: number
          nullable: true
        raw_mean:
          type: number
          nullable: true
        best_reward:
          type: number
          nullable: true
        count:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 0
        method:
          type: string
        pass_threshold:
          type: number
        passed:
          type: boolean
        done_count:
          type: integer
          minimum: 0
        failed_count:
          type: integer
          minimum: 0
        running_count:
          type: integer
          minimum: 0
        pending_count:
          type: integer
          minimum: 0
        completed_count:
          type: integer
          minimum: 0
        task_count:
          type: integer
          minimum: 0
        visible_task_count:
          type: integer
          minimum: 0
        progress:
          type: integer
          minimum: 0
          maximum: 100
        total_duration_ms:
          type: integer
          minimum: 0
        avg_duration_ms:
          type: number
          minimum: 0
    JobEnvListResponse:
      type: object
      required: [items, total, offset, limit, env_count, task_count, filtered_task_count, status_counts, task_counts]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/JobEnvSummary"
        total:
          type: integer
          minimum: 0
          description: Number of Env groups matching the status filter.
        offset:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 1
        env_count:
          type: integer
          minimum: 0
          description: Number of Env groups before filtering.
        task_count:
          type: integer
          minimum: 0
          description: Number of Tasks before filtering.
        filtered_task_count:
          type: integer
          minimum: 0
          description: Number of Tasks matching the status filter across all matching Env groups.
        status_counts:
          type: object
          additionalProperties:
            type: integer
        task_counts:
          $ref: "#/components/schemas/JobTaskCounts"
        result:
          $ref: "#/components/schemas/JobResult"
    JobTaskListResponse:
      type: object
      required: [items, total, offset, limit]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Task"
        total:
          type: integer
          minimum: 0
        offset:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 1
    JobAcceptedResponse:
      type: object
      required: [job_id, task_ids]
      properties:
        job_id:
          type: string
        task_id:
          type: string
          description: Present only when exactly one Task was created.
        task_ids:
          type: array
          items:
            type: string
        job:
          $ref: "#/components/schemas/BenchmarkJob"
    CreateRescoreJobRequest:
      type: object
      required: [reward_ref]
      properties:
        job_id:
          type: string
          description: Optional readable name for the derived Job. A unique -rescore suffix is generated when omitted.
        reward_ref:
          $ref: "#/components/schemas/VersionRef"
        concurrency_policy:
          $ref: "#/components/schemas/ConcurrencyPolicy"
        tags:
          type: array
          description: Selection and search labels attached to the derived Job.
          items:
            type: string
        metadata:
          type: object
          additionalProperties:
            type: string
    CreateRescoreJobResponse:
      type: object
      required: [job_id, task_ids, source_job_id, reward_ref, reward_task_count, agent_task_count]
      properties:
        job_id:
          type: string
        task_ids:
          type: array
          items:
            type: string
        job:
          $ref: "#/components/schemas/BenchmarkJob"
        source_job_id:
          type: string
        reward_ref:
          $ref: "#/components/schemas/VersionRef"
        reward_task_count:
          type: integer
          minimum: 0
          description: Number of derived Tasks that will run a Reward sandbox.
        agent_task_count:
          type: integer
          enum: [0]
          description: Always zero; a RESCORE Job never launches Agent/Harness sandboxes.
    CancelJobResponse:
      type: object
      required: [job, tasks, cancelled_tasks]
      properties:
        job:
          $ref: "#/components/schemas/BenchmarkJob"
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/Task"
        cancelled_tasks:
          type: integer
          minimum: 0
        destroyed_sandboxes:
          type: array
          items:
            type: string
        skipped_sandboxes:
          type: object
          additionalProperties: true
    StopJobResponse:
      type: object
      required: [job, tasks, stopped_tasks]
      properties:
        job:
          $ref: "#/components/schemas/BenchmarkJob"
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/Task"
        stopped_tasks:
          type: integer
          minimum: 0
          description: |
            Number of non-terminal tasks actively parked by this stop. Tasks
            already in a failed-terminal status (FAILED/EVAL_FAILED/...) keep
            their status, are not counted here, and are still re-run by start.
        destroyed_sandboxes:
          type: array
          items:
            type: string
        skipped_sandboxes:
          type: object
          additionalProperties: true
    StartJobResponse:
      type: object
      required: [job, reset_tasks]
      properties:
        job:
          $ref: "#/components/schemas/BenchmarkJob"
        reset_tasks:
          type: integer
          minimum: 0
          description: Number of non-DONE tasks reset to PENDING for the re-run.
    UpdateJobConfigRequest:
      type: object
      required: [config_revision]
      properties:
        max_parallel:
          type: integer
          minimum: 1
          description: New live concurrency limit. Omit to keep the current value.
        max_retries:
          type: integer
          minimum: 0
          description: New automatic retry budget per task. Omit to keep the current value.
        retry_backoff_seconds:
          type: integer
          minimum: 0
          description: New backoff between automatic retries. Omit to keep the current value.
        config_revision:
          type: integer
          format: int64
          minimum: 0
          description: The config_revision read from the job. Mismatch returns 409.
    UpdateJobConfigResponse:
      type: object
      required: [job]
      properties:
        job:
          $ref: "#/components/schemas/BenchmarkJob"
    RetryJobRequest:
      type: object
      required: [mode]
      properties:
        mode:
          type: string
          enum: [failed, all, selected]
          description: failed = failed tasks only (CANCELLED excluded), all = every task, selected = the given task_ids.
        task_ids:
          type: array
          items:
            type: string
          description: Required when mode=selected; every id must belong to the job.
        idempotency_key:
          type: string
          description: Optional client key. Replaying the same key returns the recorded outcome instead of opening another generation.
    RetryJobResponse:
      type: object
      required: [job, generation, reset_task_ids, reused]
      properties:
        job:
          $ref: "#/components/schemas/BenchmarkJob"
        generation:
          type: integer
          minimum: 2
          description: The execution generation now running.
        reset_task_ids:
          type: array
          items:
            type: string
        reused:
          type: boolean
          description: True when the idempotency key matched an earlier retry and nothing was re-run.
    JobExecution:
      type: object
      required: [job_id, generation, mode, reset_task_ids, created_at]
      properties:
        job_id:
          type: string
        generation:
          type: integer
          minimum: 1
          description: The archived generation number.
        mode:
          type: string
          enum: [failed, all, selected]
        requested_by:
          type: string
        reset_task_ids:
          type: array
          items:
            type: string
        task_count:
          type: integer
          minimum: 0
          description: Number of task rows in the archived snapshot.
        reward_count:
          type: integer
          minimum: 0
          description: Number of archived rewards (rewards of the reset tasks).
        result_snapshot:
          $ref: "#/components/schemas/JobResult"
        tasks_snapshot:
          type: array
          items:
            $ref: "#/components/schemas/Task"
          description: Present only with full=true.
        rewards_snapshot:
          type: array
          items:
            type: object
            additionalProperties: true
          description: Present only with full=true.
        created_at:
          type: string
          format: date-time
    JobExecutionListResponse:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/JobExecution"
        total:
          type: integer
          minimum: 0
    Task:
      type: object
      required:
        - task_id
        - job_id
        - benchmark_ref
        - env_ref
        - harness_ref
        - reward_ref
        - model
        - sample_index
        - status
      properties:
        task_id:
          type: string
        job_id:
          type: string
        harness_key:
          type: string
        env_key:
          type: string
        benchmark_ref:
          $ref: "#/components/schemas/VersionRef"
        env_ref:
          $ref: "#/components/schemas/VersionRef"
        harness_ref:
          $ref: "#/components/schemas/VersionRef"
        reward_ref:
          $ref: "#/components/schemas/VersionRef"
        model_ref:
          $ref: "#/components/schemas/VersionRef"
        model:
          $ref: "#/components/schemas/ModelSpec"
        sample_index:
          type: integer
        attempts:
          type: integer
        generation:
          type: integer
          minimum: 1
          description: The execution generation this task row belongs to (see BenchmarkJob.execution_generation).
        source_task_id:
          type: string
          description: Set for a derived RESCORE Task; source agent products are mounted from this Task.
        source_attempt:
          type: integer
          minimum: 1
          description: Source Task attempt whose workspace/out products are reused by a RESCORE Task.
        status:
          $ref: "#/components/schemas/TaskStatus"
        trace_id:
          type: string
        traceparent:
          type: string
        score:
          type: number
          minimum: 0
          maximum: 1
          nullable: true
        workspace_uri:
          type: string
        agent_sandbox_id:
          type: string
        eval_sandbox_id:
          type: string
        timings:
          type: object
          additionalProperties:
            type: integer
        failure:
          $ref: "#/components/schemas/Error"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ArtifactRef:
      type: object
      required: [name, uri]
      properties:
        name:
          type: string
        attempt:
          type: integer
          minimum: 0
          description: Task attempt number that produced the artifact.
        uri:
          type: string
          description: Product artifact URL; screenshot URLs include the attempt query parameter.
        path:
          type: string
          description: Runtime path originally reported by Harness or Reward, when available.
          readOnly: true
        type:
          type: string
        role:
          type: string
          enum: [harness, reward, platform]
        size_bytes:
          type: integer
        digest:
          type: string
    RewardReviewEvidenceAsset:
      type: object
      required: [name, mime_type, uri]
      properties:
        name:
          type: string
        mime_type:
          type: string
        uri:
          type: string
          description: Authenticated, opaque endpoint for the declared evidence file.
    RewardReviewEvidence:
      type: object
      required: [id, kind, detail]
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [screenshot, trace, command, file, http, observation]
        detail:
          type: string
        artifact:
          $ref: "#/components/schemas/RewardReviewEvidenceAsset"
    RewardReviewCheck:
      type: object
      required: [id, label, visibility, gate, required, status, score]
      properties:
        id:
          type: string
        label:
          type: string
          description: Stable check label. Hidden criteria are redacted for non-root callers.
        kind:
          type: string
        visibility:
          type: string
          enum: [public, hidden]
        gate:
          type: string
          enum: [p0, scored]
        required:
          type: boolean
        status:
          type: string
          enum: [pass, fail]
        score:
          type: number
          minimum: 0
          maximum: 1
          description: Binary pass result for this atomic check.
        weight:
          type: number
          minimum: 0
        contribution:
          type: number
          minimum: 0
          description: Earned weighted contribution. P0 checks are gates and have no contribution.
        detail:
          type: string
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/RewardReviewEvidence"
    RewardReviewAgent:
      type: object
      required: [status, advisory]
      properties:
        status:
          type: string
        advisory:
          type: boolean
          description: "Always true: verifier-agent output never changes score or pass."
        comparable_check_count:
          type: integer
          minimum: 0
    RewardReview:
      type: object
      required: [schema, authoritative, status, score, pass, checks]
      properties:
        schema:
          type: string
          enum: [x2env.reward-review.v1]
        authoritative:
          type: string
          enum: [script]
        status:
          type: string
        score:
          type: number
          minimum: 0
          maximum: 1
        pass:
          type: boolean
        sub_scores:
          type: object
          additionalProperties:
            type: number
        checks:
          type: array
          items:
            $ref: "#/components/schemas/RewardReviewCheck"
        agent:
          $ref: "#/components/schemas/RewardReviewAgent"
    TaskResult:
      type: object
      required: [task_id, status, computed_at]
      properties:
        task_id:
          type: string
        status:
          $ref: "#/components/schemas/ResultStatus"
        score:
          type: number
          minimum: 0
          maximum: 1
          nullable: true
        sub_scores:
          type: object
          additionalProperties:
            type: number
        pass:
          type: boolean
        raw:
          type: object
          additionalProperties: true
        artifacts_uri:
          type: string
        trace_id:
          type: string
        computed_at:
          type: string
          format: date-time
    JobResult:
      type: object
      required: [job_id, aggregation, task_count, computed_at]
      properties:
        job_id:
          type: string
        aggregate_score:
          type: number
          minimum: 0
          maximum: 1
          nullable: true
        aggregation:
          $ref: "#/components/schemas/AggregationSpec"
        task_count:
          type: integer
        ok_count:
          type: integer
        failed_count:
          type: integer
        leaderboard_key:
          type: object
          properties:
            benchmark_ref:
              $ref: "#/components/schemas/VersionRef"
            harness_ref:
              $ref: "#/components/schemas/VersionRef"
            model_name:
              type: string
        per_env:
          type: array
          items:
            type: object
            properties:
              env_ref:
                $ref: "#/components/schemas/VersionRef"
              score:
                type: number
                nullable: true
              task_ids:
                type: array
                items:
                  type: string
        computed_at:
          type: string
          format: date-time
    LeaderboardRow:
      type: object
      required:
        - rank
        - job_id
        - sample_numbers
        - task_count
        - ok_count
        - failed_count
        - status
        - created_at
        - computed_at
      properties:
        rank:
          type: integer
          minimum: 1
        job_id:
          type: string
        harness_key:
          type: string
        benchmark_ref:
          $ref: "#/components/schemas/VersionRef"
        harness_ref:
          $ref: "#/components/schemas/VersionRef"
        model_ref:
          $ref: "#/components/schemas/VersionRef"
        model:
          $ref: "#/components/schemas/ModelSpec"
        sample_numbers:
          type: integer
          minimum: 1
        aggregate_score:
          type: number
          minimum: 0
          maximum: 1
          nullable: true
        task_count:
          type: integer
          minimum: 0
        ok_count:
          type: integer
          minimum: 0
        failed_count:
          type: integer
          minimum: 0
        status:
          $ref: "#/components/schemas/JobStatus"
        created_at:
          type: string
          format: date-time
        computed_at:
          type: string
          format: date-time
    TaskEvent:
      type: object
      required: [id, task_id, attempt, phase, status, message, timestamp]
      properties:
        id:
          type: integer
        task_id:
          type: string
        attempt:
          type: integer
          minimum: 0
        phase:
          type: string
        status:
          type: string
        message:
          type: string
        data_ref:
          type: string
        timestamp:
          type: string
          format: date-time
    TaskTrace:
      type: object
      required: [events]
      properties:
        task:
          allOf:
            - $ref: "#/components/schemas/Task"
          nullable: true
        reward:
          type: object
          nullable: true
          additionalProperties: true
        trace_id:
          type: string
        span_query:
          type: object
          properties:
            backend:
              type: string
            ok:
              type: boolean
            status:
              type: integer
            error:
              type: string
            queried_at:
              type: string
              format: date-time
        spans:
          type: array
          items:
            $ref: "#/components/schemas/TraceSpan"
        events:
          type: array
          items:
            $ref: "#/components/schemas/TaskEvent"
        artifacts:
          type: array
          items:
            $ref: "#/components/schemas/ArtifactRef"
    TraceSpan:
      type: object
      required: [span_id, name]
      properties:
        trace_id:
          type: string
        span_id:
          type: string
        parent_span_id:
          type: string
        name:
          type: string
        kind:
          type: string
        service_name:
          type: string
        scope_name:
          type: string
        start_unix_nano:
          type: integer
          format: int64
        end_unix_nano:
          type: integer
          format: int64
        duration_ms:
          type: number
        status_code:
          type: string
        status_message:
          type: string
        attributes:
          type: object
          additionalProperties: true
        events:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              time_unix_nano:
                type: integer
                format: int64
              attributes:
                type: object
                additionalProperties: true
