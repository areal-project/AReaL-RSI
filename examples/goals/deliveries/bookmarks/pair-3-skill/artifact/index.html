<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bookmarks</title><style>
*{box-sizing:border-box}body{margin:0;padding:24px;background:#f5f7fb;color:#202938;font:15px system-ui,sans-serif}.app{max-width:960px;margin:auto}header{margin-bottom:18px}h1{margin:0;font-size:25px}.sub{margin:4px 0;color:#667085}.panel{background:#fff;border:1px solid #e3e8ef;border-radius:14px;padding:16px;margin-bottom:16px;box-shadow:0 2px 10px #0f172a0d}.add{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end}.field{display:grid;gap:5px}.field label{font-size:12px;font-weight:700;color:#526174}.field input,.edit-input{width:100%;min-height:40px;padding:8px 10px;border:1px solid #cbd5e1;border-radius:8px;font:inherit}.btn{min-height:40px;min-width:40px;padding:8px 13px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;color:#25334a;font:inherit;font-weight:650;cursor:pointer}.primary{background:#2563eb;border-color:#2563eb;color:#fff}.msg{min-height:20px;padding-top:8px;color:#b42318;font-size:13px}.filters{display:flex;flex-wrap:wrap;gap:8px}.filter.active{background:#e0eaff;border-color:#93b4ff;color:#1745a0}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.item{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:11px;align-items:center;padding:13px 0;border-bottom:1px solid #edf0f4;min-width:0}.item:last-child{border-bottom:0}.toggle{width:24px;height:24px}.bookmark{min-width:0}.bookmark a{display:block;color:#1d4ed8;font-weight:650;text-decoration:none;overflow-wrap:anywhere}.meta{margin-top:4px;font-size:12px;color:#6b7280;overflow-wrap:anywhere}.actions{display:flex;flex-wrap:wrap;gap:7px;justify-content:flex-end}.small{min-height:32px;padding:5px 9px;font-size:13px}.edit-wrap{display:flex;gap:7px;min-width:0}.empty{text-align:center;color:#697586;padding:32px 8px}@media(max-width:620px){body{padding:14px}.add{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.item{grid-template-columns:24px minmax(0,1fr)}.actions{grid-column:2;justify-content:flex-start}.actions .btn{flex:1}}
</style></head><body><main class="app"><header><h1>Bookmarks</h1><p class="sub">Keep useful links close at hand.</p></header><section class="panel"><form id="form" novalidate><div class="add"><div class="field"><label for="title-input">Title</label><input id="title-input" data-testid="title-input" autocomplete="off" placeholder="A useful article"></div><div class="field"><label for="url-input">URL</label><input id="url-input" data-testid="url-input" type="url" inputmode="url" placeholder="https://example.com"></div><button class="btn primary" data-testid="add">Add bookmark</button></div><div id="msg" class="msg" role="alert"></div></form></section><section class="panel"><div class="top"><h2 style="margin:0;font-size:18px">Your bookmarks</h2><div class="filters"><button class="btn filter active" data-testid="filter-all" type="button">All</button><button class="btn filter" data-testid="filter-active" type="button">Active</button><button class="btn filter" data-testid="filter-completed" type="button">Completed</button></div></div><div id="items"></div></section></main><script>
(()=>{const K='bookmark-app-data-v1',S={items:[],filter:'all',editing:null},$=id=>document.getElementById(id);const form=$('form'),title=$('title-input'),url=$('url-input'),msg=$('msg'),list=$('items');
function persist(){try{localStorage.setItem(K,JSON.stringify(S.items))}catch(e){}}function load(){try{const x=JSON.parse(localStorage.getItem(K)||'[]');if(Array.isArray(x))S.items=x.filter(i=>i&&typeof i.id==='string'&&typeof i.title==='string'&&typeof i.url==='string'&&typeof i.starred==='boolean')}catch(e){}}function valid(x){try{const u=new URL(x);return(u.protocol==='http:'||u.protocol==='https:')&&!!u.hostname}catch(e){return false}}function say(x){msg.textContent=x||''}
function button(text,test){const b=document.createElement('button');b.type='button';b.className='btn small';b.textContent=text;b.dataset.testid=test;return b}function render(){document.querySelectorAll('.filter').forEach(b=>b.classList.toggle('active',b.dataset.testid==='filter-'+S.filter));list.textContent='';const a=S.items.filter(i=>S.filter==='all'||S.filter==='active'&&!i.starred||S.filter==='completed'&&i.starred);if(!a.length){const e=document.createElement('div');e.className='empty';e.textContent=S.items.length?'No bookmarks in this filter.':'No bookmarks yet. Add your first link above.';list.append(e);return}a.forEach(i=>{const r=document.createElement('article');r.className='item';r.dataset.testid='item';const t=document.createElement('input');t.type='checkbox';t.className='toggle';t.dataset.testid='toggle';t.checked=i.starred;t.setAttribute('aria-label','Toggle '+i.title);t.onchange=()=>{i.starred=t.checked;persist();render()};r.append(t);const m=document.createElement('div');m.className='bookmark';if(S.editing===i.id){const w=document.createElement('div');w.className='edit-wrap';const q=document.createElement('input');q.className='edit-input';q.dataset.testid='edit-input';q.value=i.title;const sv=button('Save','save');sv.onclick=()=>{const n=q.value.trim();if(!n){q.focus();return}i.title=n;S.editing=null;persist();render()};q.onkeydown=e=>{if(e.key==='Enter')sv.click();if(e.key==='Escape'){S.editing=null;render()}};w.append(q,sv);m.append(w);setTimeout(()=>{q.focus();q.select()},0)}else{const l=document.createElement('a');l.href=i.url;l.target='_blank';l.rel='noopener noreferrer';l.textContent=i.title;const z=document.createElement('div');z.className='meta';z.textContent=i.url;m.append(l,z)}r.append(m);const ac=document.createElement('div');ac.className='actions';if(S.editing!==i.id){const ed=button('Edit','edit');ed.onclick=()=>{S.editing=i.id;render()};ac.append(ed)}const del=button('Delete','delete');del.onclick=()=>{S.items=S.items.filter(x=>x.id!==i.id);S.editing=null;persist();render()};ac.append(del);r.append(ac);list.append(r)})}
form.onsubmit=e=>{e.preventDefault();const t=title.value.trim(),u=url.value.trim();if(!t){say('Please enter a title.');title.focus();return}if(!valid(u)){say('Enter a valid absolute http:// or https:// URL.');url.focus();return}S.items.push({id:Date.now().toString(36)+'-'+Math.random().toString(36).slice(2),title:t,url:u,starred:false});persist();form.reset();say('Bookmark added.');render()};document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{S.filter=b.dataset.testid.replace('filter-','');S.editing=null;render()});load();render()})();
</script></body></html>
