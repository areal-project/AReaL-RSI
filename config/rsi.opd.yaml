# End-to-end Experience OPD Run launched from RSI (nested-Slurm, multi-node).
#
# `run --config config/rsi.opd.yaml` (or the start-rsi-experiment skill with
# --method opd) drives the full loop: the Researcher extracts per-task
# experiences, RSI conditions skill_eval on them, and the SAME experiences
# become AReaL OPD's experience_path. The train step submits AReaL's Experience
# OPD Slurm driver (see config/areal.opd.yaml).
#
# For ids to line up, the mock benchmark task set and the OPD train data are the
# same SWE JSONL (task_id == instance_id). REPLACE the placeholder data/model
# paths below with your SWE assets; OPD needs a real 4x8 allocation + sandbox
# (AENV_SYSTEM_URL) + credentials in the environment (not runnable on a single
# reservation node).
run:
  initial_ckpt: /storage/openpsi/models/Qwen__Qwen3-Coder-30B   # student = SWE coder checkpoint
  method: opd
  max_iterations: 1
  run_root: /storage/openpsi/rsi-runs/swe-opd-demo

env:
  benchmark: swe-bench-verified@mock
  holdout_benchmark: swe-bench-verified@mock
  harness_config:
    harness: claude-code-swe-baseline@mock

services:
  areal:
    config_path: areal.opd.yaml
  envarena:
    backend: mock
    # SWE task JSONL (rows carry instance_id); mock trajectory task_ids come
    # from here so Researcher experiences line up with the OPD train data.
    task_set_path: /storage/openpsi/users/fenghui/datasets/swe/opd_train.jsonl
    task_set_limit: 64
  research:
    backend: mock

train:
  config:
    # OPD train/valid data (instance_ids match the mock task set above).
    # experience_path is materialized by the controller from the Researcher's
    # experiences at train time (not set here).
    train_data_path: /storage/openpsi/users/fenghui/datasets/swe/opd_train.jsonl
    valid_data_path: /storage/openpsi/users/fenghui/datasets/swe/opd_train.jsonl
    trial_name: swe-opd

stop_criteria:
  target_mean_reward: 1.0
