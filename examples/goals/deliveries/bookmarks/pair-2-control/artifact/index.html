<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bookmarks</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#1f2937;background:#f5f7fb}
*{box-sizing:border-box}
body{margin:0;min-width:0}
main{width:min(100% - 24px,920px);margin:0 auto;padding:28px 0 48px}
h1{margin:0 0 6px;font-size:clamp(1.6rem,4vw,2.2rem);color:#111827}
.subtitle{margin:0 0 22px;color:#64748b}
.panel,.toolbar{background:#fff;border:1px solid #dbe3ee;border-radius:14px;box-shadow:0 4px 18px #20304d0b}
.panel{padding:16px;margin-bottom:18px}
.form{display:grid;grid-template-columns:1fr 1.35fr auto;gap:10px;align-items:end}
label{display:flex;flex-direction:column;gap:6px;font-weight:650;font-size:.84rem;color:#475569}
input[type=text],input[type=url],.edit-input{width:100%;min-width:0;height:42px;border:1px solid #cbd5e1;border-radius:9px;padding:8px 11px;font:inherit;color:#111827;background:#fff}
input:focus,button:focus{outline:3px solid #93c5fd;outline-offset:1px}
button{min-height:42px;border:0;border-radius:9px;padding:8px 15px;font:inherit;font-weight:700;cursor:pointer;background:#2563eb;color:#fff}
button:hover{background:#1d4ed8}.secondary{background:#e8eef7;color:#334155}.secondary:hover{background:#dbe5f2}.danger{background:#fee2e2;color:#b91c1c}.danger:hover{background:#fecaca}
.message{min-height:20px;margin:10px 2px 0;color:#b91c1c;font-size:.9rem}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;margin-bottom:12px;flex-wrap:wrap}
.filters{display:flex;gap:7px;flex-wrap:wrap}.filter{min-height:34px;padding:5px 12px;background:transparent;color:#475569;border:1px solid #cbd5e1}.filter:hover{background:#f1f5f9}.filter.selected{background:#1e3a8a;color:#fff;border-color:#1e3a8a}
.count{color:#64748b;font-size:.9rem}.list{display:grid;gap:10px}.empty{padding:28px 16px;text-align:center;color:#64748b;background:#fff;border:1px dashed #cbd5e1;border-radius:12px}
.item{display:flex;align-items:center;gap:10px;padding:13px 12px;background:#fff;border:1px solid #dbe3ee;border-radius:12px;min-height:68px;min-width:0}.item.completed{background:#f8fafc}.item.completed .title{text-decoration:line-through;color:#94a3b8}
.toggle{width:24px;height:24px;min-width:24px;accent-color:#2563eb;cursor:pointer}.item-body{flex:1;min-width:0}.title{display:block;font-weight:700;overflow-wrap:anywhere;word-break:break-word;color:#1e3a8a;text-decoration:none}.title:hover{text-decoration:underline}.url{display:block;margin-top:3px;color:#64748b;font-size:.78rem;overflow-wrap:anywhere;word-break:break-word}.actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.actions button{min-height:34px;padding:5px 10px;font-size:.86rem}.edit-wrap{display:flex;gap:7px;align-items:center}.edit-wrap .edit-input{height:36px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:600px){main{width:min(100% - 16px,920px);padding-top:20px}.form{grid-template-columns:1fr;gap:9px}.form button{width:100%}.toolbar{align-items:flex-start}.item{align-items:flex-start;padding:11px 9px}.toggle{margin-top:2px}.actions{width:100%;justify-content:flex-start}.actions button{flex:1}.item-body{width:calc(100% - 34px)}.edit-wrap{flex-wrap:wrap}.edit-wrap .edit-input{flex:1;min-width:150px}.edit-wrap button{flex:0 0 auto}}
</style>
</head>
<body>
<main>
<h1>My bookmarks</h1><p class="subtitle">Save useful links and keep them organized.</p>
<section class="panel" aria-label="Add bookmark">
<form id="add-form" class="form" novalidate>
<label>Title<input data-testid="title-input" id="title-input" type="text" autocomplete="off" placeholder="Bookmark title"></label>
<label>URL<input data-testid="url-input" id="url-input" type="url" autocomplete="off" placeholder="https://example.com"></label>
<button data-testid="add" type="submit">Add bookmark</button>
</form><div id="message" class="message" role="alert" aria-live="polite"></div>
</section>
<section aria-label="Bookmark list">
<div class="toolbar"><div class="filters" role="group" aria-label="Filter bookmarks"><button type="button" data-testid="filter-all" class="filter selected">All</button><button type="button" data-testid="filter-active" class="filter">Active</button><button type="button" data-testid="filter-completed" class="filter">Completed</button></div><span id="count" class="count"></span></div>
<div id="list" class="list"></div>
</section>
</main>
<script>
(() => {
  const KEY = 'bookmark-app-data-v1';
  let bookmarks = load();
  let filter = 'all';
  const form = document.getElementById('add-form'), titleInput = document.getElementById('title-input'), urlInput = document.getElementById('url-input'), list = document.getElementById('list'), message = document.getElementById('message'), count = document.getElementById('count');
  function load(){ try { const value=JSON.parse(localStorage.getItem(KEY)||'[]'); return Array.isArray(value) ? value.filter(x=>x && typeof x.title==='string' && typeof x.url==='string').map(x=>({id:String(x.id||crypto.randomUUID()),title:x.title,url:x.url,completed:x.completed===true})) : []; } catch(e){ return []; } }
  function persist(){ localStorage.setItem(KEY, JSON.stringify(bookmarks)); }
  function validUrl(value){ try { const u=new URL(value); return (u.protocol==='http:'||u.protocol==='https:') && !!u.hostname; } catch(e){ return false; } }
  function show(text){ message.textContent=text; }
  function visible(){ return bookmarks.filter(b => filter==='all' || (filter==='completed'?b.completed:!b.completed)); }
  function render(){
    list.replaceChildren(); const rows=visible(); count.textContent = `${rows.length} ${rows.length===1?'bookmark':'bookmarks'}`;
    if(!rows.length){ const empty=document.createElement('div'); empty.className='empty'; empty.textContent=bookmarks.length?'No bookmarks match this filter.':'No bookmarks yet. Add your first link above.'; list.append(empty); return; }
    rows.forEach(bookmark=>{
      const row=document.createElement('article'); row.className='item'+(bookmark.completed?' completed':''); row.dataset.testid='item'; row.dataset.id=bookmark.id;
      const toggle=document.createElement('input'); toggle.type='checkbox'; toggle.className='toggle'; toggle.dataset.testid='toggle'; toggle.checked=bookmark.completed; toggle.setAttribute('aria-label',bookmark.completed?'Mark active':'Mark completed');
      toggle.addEventListener('change',()=>{ bookmark.completed=toggle.checked; persist(); render(); });
      const body=document.createElement('div'); body.className='item-body';
      const anchor=document.createElement('a'); anchor.className='title'; anchor.href=bookmark.url; anchor.target='_blank'; anchor.rel='noopener noreferrer'; anchor.textContent=bookmark.title;
      const small=document.createElement('span'); small.className='url'; small.textContent=bookmark.url; body.append(anchor,small);
      const actions=document.createElement('div'); actions.className='actions';
      const edit=document.createElement('button'); edit.type='button'; edit.className='secondary'; edit.dataset.testid='edit'; edit.textContent='Edit';
      const del=document.createElement('button'); del.type='button'; del.className='danger'; del.dataset.testid='delete'; del.textContent='Delete';
      edit.addEventListener('click',()=>startEdit(row,bookmark));
      del.addEventListener('click',()=>{ bookmarks=bookmarks.filter(x=>x.id!==bookmark.id); persist(); render(); });
      actions.append(edit,del); row.append(toggle,body,actions); list.append(row);
    });
  }
  function startEdit(row, bookmark){
    const body=row.querySelector('.item-body'), actions=row.querySelector('.actions'); body.replaceChildren();
    const wrap=document.createElement('div'); wrap.className='edit-wrap'; const input=document.createElement('input'); input.type='text'; input.className='edit-input'; input.dataset.testid='edit-input'; input.value=bookmark.title; input.setAttribute('aria-label','Edit title');
    const save=document.createElement('button'); save.type='button'; save.dataset.testid='save'; save.textContent='Save';
    const cancel=document.createElement('button'); cancel.type='button'; cancel.className='secondary'; cancel.textContent='Cancel';
    const commit=()=>{ const title=input.value.trim(); if(!title){ input.setCustomValidity('Title cannot be empty'); input.reportValidity(); return; } bookmark.title=title; persist(); show(''); render(); };
    save.addEventListener('click',commit); cancel.addEventListener('click',render); input.addEventListener('keydown',e=>{if(e.key==='Enter')commit();if(e.key==='Escape')render()}); wrap.append(input,save,cancel); body.append(wrap); actions.replaceChildren(); input.focus(); input.select();
  }
  form.addEventListener('submit',e=>{ e.preventDefault(); const title=titleInput.value.trim(), url=urlInput.value.trim(); if(!title){show('Please enter a title.'); titleInput.focus(); return;} if(!validUrl(url)){show('Please enter a valid absolute http:// or https:// URL.'); urlInput.focus(); return;} bookmarks.push({id:crypto.randomUUID(),title,url,completed:false}); persist(); form.reset(); show(''); filter='all'; document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('selected',x.dataset.testid==='filter-all')); render(); titleInput.focus(); });
  document.querySelectorAll('.filter').forEach(button=>button.addEventListener('click',()=>{filter=button.dataset.testid.replace('filter-','');document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('selected',x===button));render();}));
  render();
})();
</script>
</body>
</html>
