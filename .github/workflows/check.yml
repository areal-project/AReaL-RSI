name: Check

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install native Codex for offline protocol tests
        run: npm install -g @openai/codex@0.162.1
      - name: Install locked dependencies
        run: |
          python -m pip install uv
          uv sync --locked
      - name: Check architecture, behavior, types and runtime
        run: make check
